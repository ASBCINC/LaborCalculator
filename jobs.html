<style>
:root { --gold:#C7A66A; --bg:#050505; --card:#111318; --line:#26292f; --muted:#8b8f98; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
.wrap { max-width:860px; margin:0 auto; padding:16px 14px 60px; }
header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
h1 { font-size:20px; margin:0; letter-spacing:.02em; }
h1 span { color:var(--gold); }
.btn { display:inline-flex; align-items:center; height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--line); color:#fff; text-decoration:none; font-size:12px; font-weight:600; background:#1a1d23; }
input, select { background:#101216; border:1px solid var(--line); color:#fff; border-radius:10px; padding:10px 12px; font-size:14px; width:100%; }
.controls { display:flex; gap:8px; margin-bottom:12px; }
.badge { display:inline-block; font-size:9px; font-weight:700; letter-spacing:.06em; padding:2px 7px; border-radius:999px; border:1px solid; vertical-align:middle; }
.b-t { color:#8fb3ff; border-color:#33518f; }
.b-l { color:#ffd479; border-color:#8a6d2f; }
.b-a { color:#7ee2a0; border-color:#2f7a4c; }
.qrow { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
.qrow:hover { border-color:var(--gold); }
.qtop { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
.qname { font-weight:700; font-size:15px; }
.qmeta { color:var(--muted); font-size:11px; margin-top:2px; }
.qnums { text-align:right; font-variant-numeric:tabular-nums; font-size:13px; white-space:nowrap; }
.qnum-b { color:var(--gold); font-weight:700; }
.qdetail { display:none; border-top:1px solid var(--line); margin-top:10px; padding-top:10px; font-size:12px; color:#d7d9de; overflow-x:auto; }
.qrow.open .qdetail { display:block; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:4px 6px; border-bottom:1px solid #1d2026; font-variant-numeric:tabular-nums; }
th { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.05em; }
.pos { color:#7ee2a0; } .neg { color:#ff8b8b; }
.sect { margin:18px 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; }
.empty { text-align:center; color:var(--muted); padding:30px 0; }
details summary { cursor:pointer; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
details[open] summary { margin-bottom:8px; }
.qactions { display:flex; gap:6px; margin-top:8px; }
.qbtn { height:28px; padding:0 12px; border-radius:7px; border:1px solid var(--line); background:#1a1d23; color:#fff; font-size:11px; font-weight:600; cursor:pointer; }
.qbtn-load { border-color:#8a6d2f; color:#ffd479; }
.qbtn-del { border-color:#5a2b2b; color:#ff8b8b; }
.qbtn:hover { border-color:var(--gold); }
</style>
<style>
textarea { background:#101216; border:1px solid var(--line); color:#fff; border-radius:10px; padding:10px 12px; font-size:14px; width:100%; font-family:inherit; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.item { display:grid; grid-template-columns:1fr 90px; gap:6px 8px; padding:8px 0; border-bottom:1px solid #1d2026; }
.item .nm { font-size:14px; }
.item .note { grid-column:1 / -1; }
.item input { padding:8px 10px; }
.st { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.06em; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
.st-won { color:#ffd479; border-color:#8a6d2f; } .st-scheduled { color:#8fb3ff; border-color:#33518f; } .st-submitted { color:#ff9f6b; border-color:#8a4b2f; } .st-closed { color:#7ee2a0; border-color:#2f7a4c; }
.gold { background:var(--gold); color:#050505; border-color:var(--gold); }
.chk { display:flex; align-items:center; gap:6px; font-size:13px; }

.right { text-align:right; }

input, select, textarea { font-size:16px; }
.qbtn { min-height:36px; }
.steps { display:flex; gap:4px; margin:0 0 10px; position:sticky; top:0; z-index:5; background:var(--bg); padding:6px 0; }
.steps button { flex:1; min-width:0; height:44px; border-radius:10px; border:1px solid var(--line); background:#101216; color:var(--muted); font-size:11px; font-weight:700; line-height:1.15; padding:0 4px; }
.steps button b { display:block; font-size:13px; }
.steps button.on { border-color:var(--gold); color:var(--gold); }
.steps button.bad { color:#ff8b8b; border-color:#8a2f2f; }
.step { display:none; } .step.on { display:block; }
.actbar { position:sticky; bottom:0; z-index:6; display:flex; gap:8px; align-items:center; background:rgba(5,5,5,.96); border-top:1px solid var(--line); margin:12px -14px -60px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
.actbar .qbtn { height:48px; min-height:48px; font-size:15px; border-radius:12px; flex:1; padding:0 10px; }
.actbar .qbtn.slim { flex:0 0 auto; }
#saveState { position:absolute; left:14px; top:-18px; font-size:11px; color:var(--muted); }
.miss, .miss:focus { outline:2px solid #ff6b6b !important; outline-offset:2px; border-radius:10px; }
.stp { display:flex; align-items:center; gap:4px; }
.stp input { text-align:center; }
.stp button { flex:0 0 40px; height:40px; border-radius:10px; border:1px solid var(--line); background:#1a1d23; color:#fff; font-size:20px; font-weight:700; padding:0; }
.sheetbg { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:#111318; border:1px solid var(--line); border-bottom:0; border-radius:18px 18px 0 0; width:100%; max-width:560px; max-height:85vh; overflow:auto; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); animation:sheetup .18s ease-out; }
@keyframes sheetup { from { transform:translateY(40px); opacity:0; } to { transform:none; opacity:1; } }
.sheet h3 { margin:0 0 4px; font-size:17px; }
.sheet .grp { margin-top:12px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
.sheet .it { display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; text-align:left; background:#1a1d23; border:1px solid var(--line); border-radius:12px; color:#fff; font-size:15px; padding:12px; margin-top:6px; min-height:48px; }
.sheet .it span:last-child { color:var(--gold); font-size:13px; white-space:nowrap; }
.sheet .acts { display:flex; gap:8px; margin-top:14px; } .sheet .acts .qbtn { flex:1; height:48px; font-size:15px; border-radius:12px; }
.item { grid-template-columns:1fr 180px; }
@media (max-width:640px) {
  #logT tr:first-child, #exT tr:first-child { display:none; }
  #logT tr, #exT tr { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px 0; border-bottom:1px solid #1d2026; }
  #logT td, #exT td { border:0; padding:0; }
  #logT td:nth-child(3), #exT td:first-child { grid-column:1 / -1; }
  .wrap { padding:10px 12px 60px; } header { flex-wrap:wrap; } header h1 { font-size:18px; }
  .qbtn { min-height:44px; font-size:13px; } .qactions { flex-wrap:wrap; }
  .item { grid-template-columns:1fr; } .item .stp { max-width:220px; }
  .row2 { grid-template-columns:1fr; }
  .actbar { margin:12px -12px -60px; padding-left:12px; padding-right:12px; }
}
@media print {
  body { background:#fff; color:#000; } .wrap { max-width:none; padding:0; }
  .no-print, header .btn { display:none !important; } .print-only { display:block; }
  .card { background:#fff; border:1px solid #bbb; color:#000; break-inside:avoid; } th { color:#444; } td, th { border-bottom:1px solid #ddd; }
  .pos { color:#0a7a3a; } .neg { color:#b00020; } h1 span { color:#000; } .sect { color:#444; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ASBC <span id="pageTitle">Jobs</span></h1>
    <div style="display:flex;gap:6px" class="no-print"><a class="btn" href="./jobs.html">All jobs</a><a class="btn" id="calcLink" href="./index.html">Calculator</a><button class="btn" id="installBtn" style="display:none;border-color:#C7A66A;color:#C7A66A">Install app</button><button class="btn" id="signOutBtn" style="display:none" onclick="if(confirm('Sign out on this device?'))firebase.auth().signOut().then(()=>location.href='./index.html')">Sign out</button></div>
  </header>
  <div id="app"><div class="empty">Loading…</div></div>
</div>
<script>
// v8.14.0 Jobs: Won -> Scheduled (admin assigns dates + techs) -> techs log actual hours per item,
// a daily time log and a recap -> Submitted -> admin approves (Closed; feeds Labor Calibration) or sends back.
firebase.initializeApp({ apiKey: "AIzaSyCSf560VkBf2esIH5rC-_Vcx349o7iIC-0", authDomain: "asbc-calculator.firebaseapp.com", projectId: "asbc-calculator" });
const db = firebase.firestore();
// v8.18.0: works offline on site. Data the tech has opened is kept on the device; saves made with no signal
// are queued and sync automatically when the connection returns.
try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
async function save(ref, data) {
  const p = ref.set(data, { merge: true });
  if (!navigator.onLine) { flash('No signal: saved on this device. It will sync automatically when you are back online.'); p.catch(() => {}); return; }
  await p;
}
function flash(t) { let b = document.getElementById('flash'); if (!b) { b = document.createElement('div'); b.id = 'flash'; b.className = 'no-print'; b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;background:#1a1d23;border:1px solid #C7A66A;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;z-index:99'; document.body.appendChild(b); } b.textContent = t; b.style.display = ''; clearTimeout(b._t); b._t = setTimeout(() => b.style.display = 'none', 5000); }
window.addEventListener('offline', () => flash('You are offline. Keep working; your entries will sync later.'));
window.addEventListener('online', () => flash('Back online: syncing your saved entries.'));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hrs = v => (Math.round((Number(v) || 0) * 100) / 100).toFixed(2);
// v8.19.0: the installer's job status, picked on the recap
const JOB_STATUSES = ['In Progress', 'Complete', 'Sales Follow up', 'PM Follow up', 'Cancelled'];
const jsColor = s => ({ 'Complete': 'st-closed', 'In Progress': 'st-scheduled', 'Sales Follow up': 'st-submitted', 'PM Follow up': 'st-submitted', 'Cancelled': '' })[s] || '';
const jsBadge = s => s ? `<span class="st ${jsColor(s)}">${esc(String(s).toUpperCase())}</span>` : '';
const jsSelect = cur => `<div class="qmeta" style="margin-top:4px">Job status (required)</div><select id="jobStatus"><option value="">Select status…</option>${JOB_STATUSES.map(x => `<option ${x === cur ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
// v8.20.0: customer sign-off (signoff.html). Required to submit a job as Complete, unless the tech records
// that the client was not present / declined, with a reason.
const SO_Q = [['look', 'Satisfied with the look and feel of the install'], ['av', 'Satisfied with sound and video quality'], ['confident', 'Confident operating the system'], ['issues', 'Any issues with the install']];
const SKIP = { 'not-present': 'Client not present', 'declined': 'Client declined to sign' };
const isSigned = q => !!(q && q.signoff && q.signoff.status === 'signed');
function signoffBox(q) {
  const so = q && q.signoff, sk = ((q && q.job) || {}).signoffSkip || {}, signed = isSigned(q);
  return `<div id="soCard" class="no-print" style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px"><div class="sect" style="margin-top:0">Customer sign-off ${signed ? '<span class="st st-closed">SIGNED</span>' : '<span style="text-transform:none;letter-spacing:0;font-weight:400">(required to mark Complete)</span>'}</div>
    ${signed ? `<div class="qmeta">Signed by <b>${esc(so.name)}</b> · ${esc(new Date(so.signedAt).toLocaleString('en-US'))}${so.concerns ? ' · <span style="color:#ff8b8b">client noted concerns</span>' : ''}</div>` : '<div class="qmeta">Fill in the recap first, then tap below and hand the device to the client.</div>'}
    <div class="qactions"><button type="button" class="qbtn ${signed ? '' : 'gold'}" id="soOpen">${signed ? 'Redo customer sign-off' : 'Open customer sign-off'}</button></div>
    ${signed ? '' : `<div class="qmeta" style="margin-top:8px">Can't get a signature?</div><div class="row2"><select id="soSkip"><option value="">—</option>${Object.entries(SKIP).map(([k, v]) => `<option value="${k}" ${sk.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select><input id="soReason" placeholder="Reason" value="${esc(sk.reason || '')}"></div>`}</div>`;
}
function signoffSkip() { const s = document.getElementById('soSkip'); if (!s || !s.value) return null; return { status: s.value, reason: (document.getElementById('soReason').value || '').trim(), at: new Date().toISOString(), by: ME.email }; }
function signoffProblem(q, jobStatus, skip) {
  if (jobStatus !== 'Complete' || isSigned(q)) return '';
  if (skip && skip.reason) return '';
  return skip ? 'Add a reason why the client could not sign.' : 'Complete jobs need the customer sign-off. Tap "Open customer sign-off", or pick "Client not present / declined" and give a reason.';
}
function signoffReport(q) {
  const so = q.signoff, sk = (q.job || {}).signoffSkip;
  if (isSigned(q)) {
    const a = so.answers || {}, good = (k, v) => k === 'issues' ? v === 'no' : v === 'yes';
    const sig = /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(so.signature || '') ? `<img src="${so.signature}" alt="Client signature" style="display:block;max-width:320px;width:100%;background:#fff;border:1px solid #ccc;border-radius:8px;margin-top:8px">` : '';
    return `<div class="card" style="${so.concerns ? 'border-color:#8a2f2f' : ''}"><div class="sect" style="margin-top:0">Customer sign-off ${so.concerns ? '<span class="st" style="color:#ff8b8b;border-color:#8a2f2f">CLIENT CONCERNS</span>' : '<span class="st st-closed">SIGNED</span>'}</div>
      <table>${SO_Q.map(([k, t]) => `<tr><td>${t}</td><td class="right ${a[k] ? (good(k, a[k]) ? 'pos' : 'neg') : ''}"><b>${a[k] === 'yes' ? 'Yes' : a[k] === 'no' ? 'No' : '—'}</b></td></tr>`).join('')}</table>
      ${so.issuesText ? `<div class="qmeta" style="margin-top:8px">Issue described by the client</div><div style="white-space:pre-wrap">${esc(so.issuesText)}</div>` : ''}
      ${so.comments ? `<div class="qmeta" style="margin-top:8px">Client comments</div><div style="white-space:pre-wrap">${esc(so.comments)}</div>` : ''}
      <div style="margin-top:10px">✓ The client acknowledged that the installation meets their expectations.</div>${sig}
      <div class="qmeta" style="margin-top:4px">Signed by <b>${esc(so.name)}</b> · ${esc(new Date(so.signedAt).toLocaleString('en-US'))} · collected by ${esc(nameOf(so.collectedBy))}</div></div>`;
  }
  if (sk && sk.status) return `<div class="card"><div class="sect" style="margin-top:0">Customer sign-off</div><div style="color:#ff9f6b">${esc(SKIP[sk.status] || sk.status)}</div>${sk.reason ? `<div class="qmeta">${esc(sk.reason)}</div>` : ''}</div>`;
  if ((q.job || {}).jobStatus === 'Complete') return '<div class="card"><div class="sect" style="margin-top:0">Customer sign-off</div><div class="qmeta">Not collected.</div></div>';
  return '';
}
// v8.23.0: install photos go to Microsoft Forms ("ASBC Job Photos", ASBC sign-in) and land in Anthony's OneDrive.
// The app only links to the form with the job filled in; no photos are stored in Firebase.
const PHOTO_FORM = 'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=C6HUDyF_EU-gpuCh9nlT-CEs4-VpOHpCu8bPd7brj3FURTFWRk82TDZWREE0NUNXQVlGUzc5RUdQVy4u&r1d298ce2470e4902b2d711a5630902ff=';
const photoJob = q => label(q) + (q && q.id ? ' [' + q.id + ']' : '');
function photoBox(q) {
  const ph = ((q && q.job) || {}).photos || {};
  return `<div class="no-print" style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px"><div class="sect" style="margin-top:0">Install photos ${ph.uploaded ? '<span class="st st-closed">UPLOADED</span>' : ''}</div>
    <div class="qmeta">Opens the ASBC Job Photos form (sign in with your ASBC Microsoft account). Up to 10 photos or videos per upload; submit again for more.</div>
    <div class="qactions"><a class="qbtn gold" id="photoOpen" href="${PHOTO_FORM + encodeURIComponent(photoJob(q))}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Upload photos</a></div>
    <label class="qmeta" style="display:flex;align-items:center;gap:6px;margin-top:6px"><input type="checkbox" id="photosDone" ${ph.uploaded ? 'checked' : ''} style="width:auto"> I uploaded the photos for this job</label></div>`;
}
function photosVal() { const c = document.getElementById('photosDone'); if (!c) return undefined; const was = ((typeof Q !== 'undefined' && Q && Q.job) || {}).photos || {}; return c.checked ? (was.uploaded ? was : { uploaded: true, at: new Date().toISOString(), by: ME.email }) : { uploaded: false }; }
const photoReport = q => { const ph = (q.job || {}).photos; return ph && ph.uploaded ? `<div class="card"><div class="sect" style="margin-top:0">Install photos</div><div>Uploaded by ${esc(nameOf(ph.by))} · ${esc(new Date(ph.at).toLocaleString('en-US'))}</div><div class="qmeta">Saved in Anthony's OneDrive (ASBC Job Photos form), under job: ${esc(photoJob(q))}</div></div>` : ''; };
// v8.21.0: who did each task (item lines and extra work)
const jobTechs = () => { const ids = ((typeof Q !== 'undefined' && Q && Q.schedule) || {}).techs || []; const list = techs().filter(t => ids.includes(t.email)); return list.length ? list : techs(); };
const techPick = (cls, attrs, sel) => { const cur = sel != null && sel !== '' ? sel : (ME && ME.role === 'tech' ? ME.email : '');
  return `<select class="${cls}" ${attrs} style="width:auto;max-width:48%;padding:8px 6px" title="Who did this"><option value="">Who did it…</option>${jobTechs().map(t => `<option value="${esc(t.email)}" ${t.email === cur ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}<option value="*" ${cur === '*' ? 'selected' : ''}>Multiple techs</option></select>`; };
const techLabel = v => v === '*' ? 'Multiple' : v ? nameOf(v) : '—';
const STATUS = { draft: 'Draft', won: 'Won', scheduled: 'Scheduled', submitted: 'Awaiting approval', closed: 'Submitted' };  // v8.24.0: no approval step; a submitted report is final (status closed)
const stBadge = s => `<span class="st st-${esc(s || 'draft')}">${esc((STATUS[s] || 'Draft').toUpperCase())}</span>`;
let ME = null, USERS = {}, CATALOG = new Map();
const app = () => document.getElementById('app');
const qid = new URLSearchParams(location.search).get('quote');
const techs = () => Object.entries(USERS).filter(([e, u]) => u.role === 'tech').map(([e, u]) => ({ email: e, name: u.name }));
const nameOf = e => (USERS[e] && USERS[e].name) || e;
const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
const label = q => q.label || (q.project && q.project.customerName) || 'Untitled';
function lineEst(it) {
  const c = it.isCustom ? it : (CATALOG.get(it.id) || {});
  const per = (Number(c.installHours) || 0) + (Number(c.programmingHours) || 0) + (it.addon ? (Number(it.addon.installHours) || 0) + (Number(it.addon.programmingHours) || 0) : 0);
  return per * (Number(it.qty) || 0);
}
const lineName = it => (it.isCustom ? it.name : ((CATALOG.get(it.id) || {}).name || it.id)) + (it.addon && it.addon.name ? ' + ' + it.addon.name : '');

// ---------- list ----------
async function showList() {
  document.getElementById('pageTitle').textContent = ME.role === 'tech' ? 'My Jobs' : 'Jobs';
  let docs;
  if (ME.role === 'tech') docs = (await db.collection('quotes').where('schedule.techs', 'array-contains', ME.email).get()).docs;
  else if (ME.role === 'rep' && !ME.allQuotes) docs = (await db.collection('quotes').where('project.salesManagerName', '==', ME.name).get()).docs;
  else docs = (await db.collection('quotes').where('status', 'in', ['won', 'scheduled', 'submitted', 'closed']).get()).docs;
  const dated = q => ((q.schedule || {}).dates || []).length > 0;
  const jobs = docs.map(d => ({ _id: d.id, ...d.data() })).filter(q => q.status && q.status !== 'draft' && !q.jobDeleted && !(q.jobHidden && !dated(q)));  // removed undated jobs come back once they get dates; deleted jobs come back only if re-scheduled from the Quote Log
  const first = q => ((q.schedule && q.schedule.dates) || []).slice().sort()[0] || '';
  const groups = ME.role === 'rep' ? [['Job reports', jobs.filter(q => ['submitted', 'closed'].includes(q.status))], ['Scheduled', jobs.filter(q => q.status === 'scheduled')]]
    : ME.role === 'tech'
    ? [['Assigned to you', jobs.filter(q => q.status === 'scheduled')], ['Submitted reports', jobs.filter(q => ['submitted', 'closed'].includes(q.status))]]

// v8.20.2: admin Delete on every job in the lists. A job report made without a quote (or a return visit) is deleted for good;
// a job built on a labor quote is taken off the Jobs page only, so the quote, its actuals and the client sign-off are kept
// (scheduling it again from the Quote Log brings it back).
async function deleteJob(id) {
  const ref = db.collection('quotes').doc(id); const s = await ref.get(); if (!s.exists) return showList();
  const q = s.data(), name = label(q);
  if (q.noQuote) {
    if (!confirm('Delete the job "' + name + '"?\n\nThis job has no labor quote, so its report, time log and sign-off are deleted permanently.')) return;
    await ref.delete();
  } else {
    if (!confirm('Delete the job "' + name + '" from the Jobs page?\n\nThe labor quote stays in the Quote Log with any hours and sign-off already recorded. Scheduling it again from the Quote Log brings the job back.')) return;
    await save(ref, { jobDeleted: true, jobDeletedAt: new Date().toISOString(), jobDeletedBy: ME.email });
  }
  showList();
}
// v8.20.1: admin can take an undated job off the Jobs page (reversible: scheduling it again from the Quote Log brings it back)
async function hideJob(id) {
  if (!confirm('Remove this job from the Jobs page? The quote stays in the Quote Log, and scheduling it again brings it back.')) return;
  await save(db.collection('quotes').doc(id), { jobHidden: true, jobHiddenAt: new Date().toISOString(), jobHiddenBy: ME.email });
  showList();
}

// ---------- v8.24.0: steps, missing-field sheet, steppers, autosave, edit & resubmit ----------
let STEP = 1, EDIT = false, SAVE_T = null;
const STEP_NAMES = ['Time', 'Items', 'Recap', 'Photos & sign-off'];
function stepNav(hasItems) { return `<div class="steps no-print">${STEP_NAMES.map((t, i) => `<button type="button" data-go="${i + 1}"><b>${i + 1}</b>${i === 1 && !hasItems ? 'Extras' : t}</button>`).join('')}</div>`; }
function goStep(n) {
  const secs = document.querySelectorAll('.step'); if (!secs.length) return;
  STEP = Math.max(1, Math.min(secs.length, n));
  secs.forEach(x => x.classList.toggle('on', Number(x.dataset.step) === STEP));
  document.querySelectorAll('.steps button').forEach(b => b.classList.toggle('on', Number(b.dataset.go) === STEP));
  const back = document.getElementById('stepBack'), next = document.getElementById('stepNext'), sub = document.getElementById('submitJob');
  if (back) back.style.visibility = STEP > 1 ? 'visible' : 'hidden';
  if (next) next.style.display = STEP < secs.length ? '' : 'none';
  if (sub) sub.style.display = STEP < secs.length ? 'none' : '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function stepOf(el) { const s = el && el.closest('.step'); return s ? Number(s.dataset.step) : 0; }
function actBar() {
  return `<div class="actbar no-print"><span id="saveState"></span>
    <button type="button" class="qbtn slim" id="stepBack">‹ Back</button>
    ${EDIT ? '<button type="button" class="qbtn slim" id="cancelEdit">Cancel</button>' : '<button type="button" class="qbtn slim" id="saveJob">Save</button>'}
    <button type="button" class="qbtn gold" id="stepNext">Next ›</button>
    <button type="button" class="qbtn gold" id="submitJob">${EDIT ? 'Resubmit to PM' : 'Submit to PM'}</button></div>`;
}
// Missing-field check. "Must fix" blocks the submit; "Please check" can be submitted anyway.
function checkJob(job) {
  const must = [], check = [];
  if (!(job.log || []).length) must.push(['Add at least one day on the time log (date, tech, hours)', '#logT']);
  if (!job.jobStatus) must.push(['Pick a job status', '#jobStatus']);
  if (!((job.recap || {}).work || '').trim()) must.push(['Fill in "Work completed"', '.rc[data-k="work"]']);
  const soP = signoffProblem(Q, job.jobStatus, job.signoffSkip); if (soP) must.push([soP.replace(/\.$/, ''), '#soCard']);
  const miss = (job.lines || []).filter(l => l.actualHours == null);
  if (miss.length) check.push([miss.length + ' item' + (miss.length > 1 ? 's have' : ' has') + ' no hours', `.ah[data-i="${miss[0].i}"]`]);
  if (!(job.photos && job.photos.uploaded) && document.getElementById('photosDone')) check.push(['Photos not marked as uploaded', '#photosDone']);
  return { must, check };
}
function markMissing(list) {
  document.querySelectorAll('.miss').forEach(x => x.classList.remove('miss'));
  list.forEach(([, sel]) => { const el = document.querySelector(sel); if (el) el.classList.add('miss'); });
  document.querySelectorAll('.steps button').forEach(b => b.classList.toggle('bad', list.some(([, sel]) => stepOf(document.querySelector(sel)) === Number(b.dataset.go))));
}
function jumpTo(sel) {
  const el = document.querySelector(sel); if (!el) return; const n = stepOf(el); if (n) goStep(n);
  setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); const f = el.matches('input,select,textarea') ? el : el.querySelector('input:not([type=checkbox]),select,textarea'); if (f && f.type !== 'checkbox') f.focus({ preventScroll: true }); }, 250);
}
function sheet({ title, sub, must = [], check = [], okLabel }) {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'sheetbg no-print';
    const row = ([t, sel]) => `<button type="button" class="it" data-sel="${esc(sel)}"><span>${esc(t)}</span><span>Fix ›</span></button>`;
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${sub ? `<div class="qmeta" style="font-size:13px">${esc(sub)}</div>` : ''}
      ${must.length ? `<div class="grp" style="color:#ff8b8b">Must fix before submitting</div>${must.map(row).join('')}` : ''}
      ${check.length ? `<div class="grp" style="color:#ffd479">Please check</div>${check.map(row).join('')}` : ''}
      <div class="acts">${must.length || !okLabel ? '<button type="button" class="qbtn gold" data-x="0">OK, fix it</button>' : `<button type="button" class="qbtn" data-x="0">Go back</button><button type="button" class="qbtn gold" data-x="1">${esc(okLabel)}</button>`}</div></div>`;
    const done = (v, sel) => { bg.remove(); res(v); if (sel) jumpTo(sel); };
    bg.addEventListener('click', e => {
      const it = e.target.closest('.it'); if (it) return done(false, it.dataset.sel);
      const b = e.target.closest('[data-x]'); if (b) return done(b.dataset.x === '1', b.dataset.x === '0' && must[0] ? must[0][1] : null);
      if (e.target === bg) done(false);
    });
    document.body.appendChild(bg);
  });
}
// +/- buttons (quarter hours) on hour fields; number pad on phones
function steppers(root) {
  (root || document).querySelectorAll('input.ah, input.lh, input.exh').forEach(inp => {
    inp.setAttribute('inputmode', 'decimal'); if (inp.parentElement.classList.contains('stp')) return;
    const w = document.createElement('div'); w.className = 'stp'; inp.parentNode.insertBefore(w, inp);
    const mk = (t, d) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.setAttribute('aria-label', d > 0 ? 'Add 15 minutes' : 'Remove 15 minutes');
      b.onclick = () => { const v = Math.max(0, Math.round(((Number(inp.value) || 0) + d) * 4) / 4); inp.value = v ? v : ''; inp.dispatchEvent(new Event('input', { bubbles: true })); }; return b; };
    w.appendChild(mk('−', -0.25)); w.appendChild(inp); w.appendChild(mk('+', 0.25));
  });
}
function saveState(t) { const el = document.getElementById('saveState'); if (el) el.textContent = t; }
function autosave() {

function actualsFrom(j) {

function diffJob(a, b) {
  a = a || {}; b = b || {}; const out = [];

  if (th(a) !== th(b)) out.push(`time on site ${hrs(th(a))} → ${hrs(th(b))} hrs`);
  if ((a.jobStatus || '') !== (b.jobStatus || '')) out.push(`status ${a.jobStatus || '—'} → ${b.jobStatus || '—'}`);
  const ih = (j, i) => ((j.lines || []).find(l => l.i === i) || {}).actualHours;
  const n = (b.lines || []).filter(l => (ih(a, l.i) ?? null) !== (l.actualHours ?? null)).length; if (n) out.push(n + ' item hour' + (n > 1 ? 's' : '') + ' changed');
  const lbl = { work: 'work completed', issues: 'problems', followups: 'open items', client: 'client feedback' };

  await db.collection('quotes').doc(q._id).set({ status: 'scheduled', schedule: { dates: sc.dates || [], techs: [...new Set((sc.techs || []).concat(techList))] } }, { merge: true });
  location.href = '?quote=' + encodeURIComponent(q._id);
}
// v8.22.0: instant Teams message to Anthony and the sales rep when a job report is submitted (relay Worker; never blocks the submit).
const RECAP_URL = 'https://yellow-cloud-830a.a-ward-612.workers.dev/recap';
async function notifyRecap(id, test) { try { const token = await firebase.auth().currentUser.getIdToken(); const r = await fetch(RECAP_URL, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ quote: id, test: !!test }) }); return r.ok ? r.json() : { error: r.status }; } catch (e) { console.warn('recap notify', e); return { error: String(e) }; } }
async function submitNew(toSign) {  // toSign: save as an open job and go to the customer sign-off page
  const msg = t => document.getElementById('nMsg').textContent = t;
  const rep = document.getElementById('nRep').value, oppId = document.getElementById('nOpp').value;
  const opp = NEW.opps.find(o => o.id === oppId);
  const log = [...document.querySelectorAll('#logT tr')].slice(1).map(tr => ({ date: tr.querySelector('.ld').value, who: tr.querySelector('.lw').value, hours: Number(tr.querySelector('.lh').value) || 0 })).filter(r => r.date && r.hours);
  const recap = {}; document.querySelectorAll('.rc').forEach(t => recap[t.dataset.k] = t.value.trim());
  const jobStatus = (document.getElementById('jobStatus') || {}).value || '';
  const skip = signoffSkip();
  const must = [];  // v8.24.0: one slide-up list of everything missing
  if (!rep) must.push(['Pick the sales rep', '#nRep']); else if (!oppId) must.push(['Pick the D-Tools opportunity', '#nOpp']);
  if (!log.length) must.push(['Enter time on site (date, tech and hours)', '#logT']);
  if (!recap.work) must.push(['Fill in "Work completed"', '.rc[data-k="work"]']);
  if (!jobStatus && !toSign) must.push(['Pick a job status', '#jobStatus']);
  if (!toSign) { const soP = signoffProblem(null, jobStatus, skip); if (soP) must.push([soP.replace(/\.$/, ''), '#soCard']); }
  if (must.length) { markMissing(must); return sheet({ title: 'A few things are missing', sub: 'Tap an item to jump to it.', must }); }
  const items = [], lines = [];
  const job = { jobStatus, lines, log, totalHours: Math.round(log.reduce((a, r) => a + r.hours, 0) * 100) / 100, recap, signoffSkip: skip, savedAt: new Date().toISOString(), savedBy: ME.email, submittedAt: new Date().toISOString(), submittedBy: ME.email, reviewNote: '', revision: 1 };
  if (toSign) { delete job.submittedAt; delete job.submittedBy; }
  const dates = [...new Set(log.map(r => r.date))].sort();
  const techList = [...new Set(log.map(r => r.who).filter(Boolean).concat(ME.role === 'tech' ? [ME.email] : []))];
  const id = 'job-' + Date.now();
  await db.collection('quotes').doc(id).set({
    id, label: opp.name, noQuote: true, status: toSign ? 'scheduled' : 'closed', items,
    project: { customerName: opp.name, salesManagerName: rep, dtoolsOpportunityId: oppId, dtoolsOppNumber: opp.number || '', dtoolsClientName: opp.clientName || '' },
    schedule: { dates, techs: techList, updatedAt: new Date().toISOString(), updatedBy: ME.email },
    job, updatedAt: new Date(), isTemplate: false, counted: 'no-quote'
  });
  if (!toSign) await notifyRecap(id);
  location.href = (toSign ? './signoff.html' : '') + '?quote=' + encodeURIComponent(id);
}

// ---------- bullet points in recap boxes (v8.15.3) ----------
// "• Bullet" starts a bullet on the current line; Enter on a bullet line starts the next bullet;
// Enter on an empty bullet ends the list.
const BUL = '\u2022 ';
document.addEventListener('click', e => {
  const b = e.target.closest('.bl'); if (!b) return;
  const ta = document.querySelector(`.rc[data-k="${b.dataset.k}"]`); if (!ta) return;
  const v = ta.value, pos = ta.selectionStart ?? v.length;
  const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
  if (v.slice(lineStart, lineStart + BUL.length) === BUL) { ta.focus(); return; }
  const lineEmpty = v.slice(lineStart, pos).trim() === '' && (v.indexOf('\n', pos) === -1 ? v.slice(pos) : v.slice(pos, v.indexOf('\n', pos))).trim() === '';
  const insertAt = lineEmpty ? lineStart : lineStart;
  ta.value = v.slice(0, insertAt) + BUL + v.slice(insertAt);
  ta.focus(); const c = pos + BUL.length; ta.setSelectionRange(c, c);
});
document.addEventListener('keydown', e => {
  const ta = e.target; if (!ta.classList || !ta.classList.contains('rc') || e.key !== 'Enter' || e.shiftKey) return;
  const v = ta.value, pos = ta.selectionStart, lineStart = v.lastIndexOf('\n', pos - 1) + 1, line = v.slice(lineStart, pos);
  if (!line.startsWith(BUL)) return;
  e.preventDefault();
  if (line.trim() === BUL.trim()) { ta.value = v.slice(0, lineStart) + v.slice(pos); ta.setSelectionRange(lineStart, lineStart); return; }
  ta.value = v.slice(0, pos) + '\n' + BUL + v.slice(pos); const c = pos + 1 + BUL.length; ta.setSelectionRange(c, c);
});

// ---------- install as an app (v8.15.2) ----------
// Same installable app as the calculator; when a tech opens it, sign-in sends them straight to Jobs.
(function () {
  const btn = document.getElementById('installBtn');
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return;
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; btn.style.display = ''; });
  window.addEventListener('appinstalled', () => { btn.style.display = 'none'; });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  btn.style.display = ''; // always offered in the browser; hidden once running as the installed app
  btn.addEventListener('click', async () => {
    if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; btn.style.display = 'none'; return; }
    alert(ios ? 'To install: tap the Share button (square with an arrow) at the bottom of Safari, then "Add to Home Screen".'
              : 'To install: open the browser menu (⋮) and choose "Install app" or "Add to Home screen".');
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
})();

firebase.auth().onAuthStateChanged(async (u) => {
  if (!u) { app().innerHTML = '<div class="empty">Sign in on the <a href="./" style="text-decoration:underline">calculator</a> first, then reopen Jobs.</div>'; return; }
  const [us, cs] = await Promise.all([db.collection('config').doc('users').get().catch(() => null), db.collection('config').doc('catalog').get().catch(() => null)]);
  USERS = (us && us.exists && us.data().users) || {};
  if (cs && cs.exists) (cs.data().items || []).forEach(i => CATALOG.set(i.id, i));
  const email = (u.email || '').toLowerCase();
  const p = USERS[email] || (email === 'a.ward@asbc.us' ? { name: 'Anthony Ward', role: 'admin' } : null);
  if (!p) { app().innerHTML = '<div class="empty">' + esc(email) + ' is not approved yet. Ask Anthony.</div>'; return; }
  ME = { email, name: p.name, role: p.role || 'rep', allQuotes: !!p.allQuotes };
  document.getElementById('signOutBtn').style.display = '';
  document.getElementById('signOutBtn').textContent = 'Sign out (' + ME.name.split(' ')[0] + ')';
  try { if (qid) await showJob(qid); else if (new URLSearchParams(location.search).get('new') && ME.role !== 'rep') showNew(); else await showList(); } catch (e) { app().innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; }
});
