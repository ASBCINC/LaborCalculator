name: Sync D-Tools opportunities

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

# v8.18.0: webhook/cron bursts never pile up: at most one run at a time plus one waiting.
concurrency:
  group: dtools-sync
  cancel-in-progress: false

permissions:
  contents: write  # v10.4.0: only used to delete the retired `data` branch
  actions: write   # lets this run start the backup / weekly report when GitHub skipped their schedule

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet google-auth requests
      - run: python3 scripts/sync_opportunities.py
        env:
          DTS_API_KEY: ${{ secrets.DTS_API_KEY }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          REPORT_ID: ${{ secrets.REPORT_ID }}
      - name: Admin pipeline data for pipeline.html (v8.28.0)
        continue-on-error: true
        run: python3 scripts/sync_pipeline.py
        env:
          DTS_API_KEY: ${{ secrets.DTS_API_KEY }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - name: Catch up skipped schedules (backup daily, weekly report Fridays)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last() { gh run list -R "$GITHUB_REPOSITORY" -w "$1" -s success -L 1 --json createdAt -q '.[0].createdAt' 2>/dev/null; }
          age_h() { [ -z "$1" ] && echo 9999 || echo $(( ( $(date -u +%s) - $(date -u -d "$1" +%s) ) / 3600 )); }
          b=$(age_h "$(last nightly-backup.yml)")
          if [ "$b" -ge 26 ]; then echo "backup is ${b}h old: starting it"; gh workflow run nightly-backup.yml -R "$GITHUB_REPOSITORY"; fi
          dow=$(TZ=America/Los_Angeles date +%u); hr=$(TZ=America/Los_Angeles date +%H)
          w=$(age_h "$(last weekly-report.yml)")
          if [ "$dow" = "5" ] && [ "$hr" -ge 4 ] && [ "$w" -ge 48 ]; then echo "weekly report missing: starting it"; gh workflow run weekly-report.yml -R "$GITHUB_REPOSITORY"; fi
      - name: Retire the old encrypted job list (v10.4.0; the D-Tools pull now reads job reports from the app)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data >/dev/null 2>&1 || { echo "data branch already removed"; exit 0; }
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete data && echo "removed data branch (jobs.enc)"
