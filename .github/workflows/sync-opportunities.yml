name: Sync D-Tools opportunities

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# v8.18.0: webhook/cron bursts never pile up: at most one run at a time plus one waiting.
concurrency:
  group: dtools-sync
  cancel-in-progress: false

permissions:
  contents: write  # publishes the encrypted job list to the `data` branch
  actions: write   # lets this run start the backup / weekly report when GitHub skipped their schedule

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet google-auth requests
      - run: python3 scripts/sync_opportunities.py
        env:
          DTS_API_KEY: ${{ secrets.DTS_API_KEY }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          REPORT_ID: ${{ secrets.REPORT_ID }}
      - name: Catch up skipped schedules (backup daily, weekly report Fridays)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last() { gh run list -R "$GITHUB_REPOSITORY" -w "$1" -s success -L 1 --json createdAt -q '.[0].createdAt' 2>/dev/null; }
          age_h() { [ -z "$1" ] && echo 9999 || echo $(( ( $(date -u +%s) - $(date -u -d "$1" +%s) ) / 3600 )); }
          b=$(age_h "$(last nightly-backup.yml)")
          if [ "$b" -ge 26 ]; then echo "backup is ${b}h old: starting it"; gh workflow run nightly-backup.yml -R "$GITHUB_REPOSITORY"; fi
          dow=$(TZ=America/Los_Angeles date +%u); hr=$(TZ=America/Los_Angeles date +%H)
          w=$(age_h "$(last weekly-report.yml)")
          if [ "$dow" = "5" ] && [ "$hr" -ge 4 ] && [ "$w" -ge 48 ]; then echo "weekly report missing: starting it"; gh workflow run weekly-report.yml -R "$GITHUB_REPOSITORY"; fi
      - name: Publish encrypted job list for the scheduled email task (data branch)
        env:
          JOBS_KEY: ${{ secrets.JOBS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$JOBS_KEY" ] && [ -f jobs.json ] || { echo "no JOBS_KEY or no job list: skipping"; exit 0; }
          new=$(sha256sum jobs.json | cut -c1-64)
          old=$(curl -fsS "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/data/jobs.sha?t=$(date +%s)" 2>/dev/null || echo none)
          [ "$old" = "$new" ] && { echo "job list unchanged"; exit 0; }
          mkdir -p /tmp/pub && cd /tmp/pub && git init -q && git checkout -q -b data
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:JOBS_KEY -base64 -in "$GITHUB_WORKSPACE/jobs.json" -out jobs.enc
          printf '%s' "$new" > jobs.sha
          git add jobs.enc jobs.sha
          git -c user.name=asbc-sync -c user.email=sync@users.noreply.github.com commit -qm "job list $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "published job list ($new)"
