name: Sync D-Tools opportunities

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_opportunities.py
        env:
          DTS_API_KEY: ${{ secrets.DTS_API_KEY }}
