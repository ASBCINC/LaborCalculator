<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labor Calculator | ASBC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandGold: '#D4AF37',
                        bgDark: '#0A0A0A',
                        bgPanel: '#171717',
                        textMuted: '#A3A3A3'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0A0A0A; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }

        @media print {
            body { background-color: white !important; color: black !important; height: auto !important; overflow: visible !important; }
            header, #catalogPanel, button, #customItemModal, .print-hide { display: none !important; }
            #estimatePanel { width: 100% !important; background-color: white !important; box-shadow: none !important; border: none !important; }
            #estimatePanel::before {
                content: "ASBC Project Labor Estimate"; display: block; font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid black;
            }
            #cartList div { background-color: white !important; border: 1px solid #ddd !important; }
            * { color: black !important; }
            .bg-gray-900 { background: white !important; border-top: 2px solid black !important; }
            .print-controls { display: none !important; }
        }
    </style>
</head>
<body class="bg-bgDark text-white h-screen flex flex-col font-sans overflow-hidden relative">

    <header class="bg-bgPanel border-b border-gray-800 p-4 flex justify-between items-center shadow-md shrink-0">

                    + Custom Labor

            </div>
        </section>

        <section id="estimatePanel" class="w-1/3 bg-bgPanel flex flex-col relative shadow-l">
            <div class="p-4 border-b border-gray-800 shrink-0">
                <h2 class="text-xl font-semibold tracking-wide text-brandGold">Current Estimate</h2>
            </div>
            <div id="cartList" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="text-textMuted text-center mt-10 italic">No items added yet.</div>
            </div>
            
            <div class="p-6 bg-gray-900 border-t border-gray-800 shrink-0 shadow-[0_-10px_20px_rgba(0,0,0,0.5)]">
                
                <!-- Recycling Toggle Box -->
                <div class="flex justify-between items-center mb-3 border-b border-gray-700 pb-3 print-hide">
                    <label for="recyclingToggle" class="text-sm font-medium text-white">Recycling equipment? (+$75.00)</label>
                    <select id="recyclingToggle" onchange="updateCalculation()" class="bg-bgDark border border-gray-700 text-white text-sm rounded focus:border-brandGold outline-none p-1 px-3">
                        <option value="no">No</option>
                        <option value="yes">Yes</option>
                    </select>
                </div>

                <!-- Materials Fee Markup Box -->
                <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-4 print-hide">
                    <label for="materialsMarkup" class="text-sm font-medium text-white">Materials Fee Markup</label>
                    <select id="materialsMarkup" onchange="updateCalculation()" class="bg-bgDark border border-gray-700 text-white text-sm rounded focus:border-brandGold outline-none p-1 px-3">
                        <option value="0">0%</option>
                        <option value="5">5%</option>
                        <option value="10">10%</option>
                    </select>
                </div>

                <div class="flex justify-between text-sm text-textMuted mb-2">
                    <span>Install Hours:</span><span id="installTotal" class="text-white font-mono">0.0</span>
                </div>
                <div class="flex justify-between text-sm text-textMuted mb-2">
                    <span>Programming Hours:</span><span id="progTotal" class="text-white font-mono">0.0</span>
                </div>
                <div class="flex justify-between text-sm text-textMuted mb-2">
                    <span>Total Hours:</span><span id="hoursTotal" class="text-white font-mono">0.0</span>
                </div>
                
                <!-- Dynamic Recycling Row -->
                <div id="recyclingPrintRow" class="flex justify-between text-sm text-brandGold mb-2 hidden">
                    <span>Recycling Fee:</span><span class="font-mono">$75.00</span>
                </div>

                    <span id="materialsLabel">Materials Fee:</span><span id="materialsPrice" class="font-mono">$0.00</span>
                </div>

                <div class="flex justify-between items-end border-t border-gray-700 pt-4 mb-4 mt-2">
                    <span class="text-lg uppercase tracking-wider text-textMuted">Total</span>
                    <span id="priceTotal" class="text-3xl font-bold text-brandGold font-mono">$0.00</span>
                </div>
                <button onclick="window.print()" class="w-full bg-brandGold text-bgDark font-bold py-3 rounded hover:bg-yellow-500 transition-colors uppercase tracking-wide">

        </section>
    </main>

        ];

        catalog.forEach(item => item.totalHours = item.installHours + item.programmingHours);

        const categories = [...new Set(catalog.map(item => item.category))].sort();
        const filterSelect = document.getElementById('categoryFilter');
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            filterSelect.appendChild(opt);
        });

        function renderCatalog(filter = 'All') {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            catalog.forEach((item, index) => {
                if (filter !== 'All' && item.category !== filter) return;

                const card = document.createElement('div');
                card.className = "bg-gray-900 border border-gray-700 rounded-lg p-4 flex flex-col justify-between hover:border-brandGold transition-colors";
                card.innerHTML = `
                    <div>
                        <div class="text-xs text-brandGold mb-1 uppercase tracking-wider">${item.category}</div>
                        <h3 class="font-medium text-sm mb-3 leading-tight">${item.name}</h3>
                    </div>
                    <div class="flex justify-between items-center mt-2 border-t border-gray-800 pt-3">
                        <div class="text-xs text-textMuted font-mono">${item.totalHours} Hrs</div>
                        <button onclick="addToCart(${index})" class="bg-gray-800 hover:bg-brandGold hover:text-bgDark text-white px-3 py-1 rounded text-sm transition-colors font-medium">+ Add</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(catalogIndex) {
            const item = catalog[catalogIndex];
            const existingItem = cart.find(i => i.name === item.name && !i.isCustom);
            
            if (existingItem) {
                existingItem.qty++;
            } else {
                cart.push({ ...item, qty: 1, isCustom: false });
            }
            renderCart();
        }

        function updateQty(cartIndex, delta) {
            cart[cartIndex].qty += delta;
            if (cart[cartIndex].qty <= 0) {
                cart.splice(cartIndex, 1);
            }
            renderCart();
        }

        function updateCalculation() {
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cartList');
            let totalInstall = 0, totalProg = 0;
            
            cartList.innerHTML = '';
            
            if (cart.length === 0) {
                cartList.innerHTML = '<div class="text-textMuted text-center mt-10 italic">No items added yet.</div>';
            } else {
                cart.forEach((item, index) => {
                    totalInstall += item.installHours * item.qty;
                    totalProg += item.programmingHours * item.qty;
                    
                    const row = document.createElement('div');
                    row.className = "bg-gray-900 p-3 rounded-lg border border-gray-800 flex justify-between items-center";
                    row.innerHTML = `
                        <div class="flex-1 pr-3">
                            <div class="text-sm font-medium leading-tight mb-1 text-brandGold">${item.name}</div>
                            <div class="text-xs text-textMuted font-mono">${(item.totalHours * item.qty).toFixed(2)} Hrs</div>
                        </div>
                        <div class="flex items-center space-x-2 bg-gray-800 rounded p-1 print-controls">
                            <button onclick="updateQty(${index}, -1)" class="w-6 h-6 flex items-center justify-center text-textMuted hover:text-white hover:bg-gray-700 rounded">-</button>
                            <span class="text-sm font-mono w-4 text-center">${item.qty}</span>
                            <button onclick="updateQty(${index}, 1)" class="w-6 h-6 flex items-center justify-center text-textMuted hover:text-white hover:bg-gray-700 rounded">+</button>
                        </div>
                    `;
                    cartList.appendChild(row);
                });
            }

            const totalHrs = totalInstall + totalProg;
            let baseLaborPrice = totalHrs * HOURLY_RATE;
            let finalPrice = baseLaborPrice;

            // Recycling Fee logic
            const addRecycling = document.getElementById('recyclingToggle').value === 'yes';
            if (addRecycling) {
                finalPrice += RECYCLING_FEE;
                document.getElementById('recyclingPrintRow').classList.remove('hidden');
            } else {
                document.getElementById('recyclingPrintRow').classList.add('hidden');
            }

            // Materials Markup logic
            const markupPercent = parseFloat(document.getElementById('materialsMarkup').value) || 0;
            if (markupPercent > 0) {
                const materialsFee = baseLaborPrice * (markupPercent / 100);
                finalPrice += materialsFee;
                document.getElementById('materialsLabel').textContent = `Materials Fee (${markupPercent}%):`;
                document.getElementById('materialsPrice').textContent = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(materialsFee);
                document.getElementById('materialsPrintRow').classList.remove('hidden');
            } else {
                document.getElementById('materialsPrintRow').classList.add('hidden');
            }

            document.getElementById('installTotal').textContent = totalInstall.toFixed(2);
            document.getElementById('progTotal').textContent = totalProg.toFixed(2);
            document.getElementById('hoursTotal').textContent = totalHrs.toFixed(2);
            document.getElementById('priceTotal').textContent = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(finalPrice);
        }

        function toggleModal(show) {
            document.getElementById('customItemModal').style.display = show ? 'flex' : 'none';
            if(show) {
                document.getElementById('customName').value = '';
                document.getElementById('customInstall').value = '';
                document.getElementById('customProg').value = '';
                document.getElementById('customName').focus();
            }
        }

        function addCustomItem() {
            const name = document.getElementById('customName').value || 'Custom Labor';
            const install = parseFloat(document.getElementById('customInstall').value) || 0;
            const prog = parseFloat(document.getElementById('customProg').value) || 0;
            
            if(install === 0 && prog === 0) return alert('Please enter at least some hours.');

            cart.push({
                category: 'Custom',
                name: name,
                installHours: install,
                programmingHours: prog,
                totalHours: install + prog,
                qty: 1,
                isCustom: true
            });
            
            toggleModal(false);
            renderCart();
        }

        document.getElementById('categoryFilter').addEventListener('change', (e) => renderCatalog(e.target.value));
        renderCatalog();
    </script>
</body>
</html>
