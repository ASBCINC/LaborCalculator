<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#b08d57">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Labor Calculator | ASBC</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandGold: '#C7A66A',
                        bgDark: '#050505',
                        bgPanel: '#0D0D0D',
                        textMuted: '#929292'
                    }
                }
            }
        };
    </script>

    <style>
        html { -webkit-text-size-adjust: 100%; }
        body { overscroll-behavior: none; }
        button, input, select { touch-action: manipulation; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0A0A0A; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }

        .category-active {
            background: #111111 !important;
            border-color: #C7A66A !important;
            color: #C7A66A !important;
        }

        .favorites-active {
            background: #111111 !important;
            border-color: #C7A66A !important;
            color: #C7A66A !important;
        }

        /* Version 3.2 brand styling: colors and borders only */
        .bg-gray-900 { background-color: #101010 !important; }
        .bg-gray-800 { background-color: #171717 !important; }
        .border-gray-800 { border-color: #1A1A1A !important; }
        .border-gray-700 { border-color: #242424 !important; }
        .hover\:border-brandGold:hover { border-color: #C7A66A !important; }
        #catalogPanel input, #catalogPanel textarea, #catalogPanel select,
        #estimatePanel input, #estimatePanel textarea, #estimatePanel select,
        #customItemModal input, #customItemModal textarea, #customItemModal select { color-scheme: dark; }
        input:focus, textarea:focus, select:focus {
            border-color: #C7A66A !important;
            box-shadow: 0 0 0 1px rgba(199, 166, 106, 0.28);
        }

        .estimate-open { transform: translateY(0) !important; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

        @media print {
            body {
                background: white !important;
                color: black !important;
                height: auto !important;
                overflow: visible !important;
            }

            header,
            #catalogPanel,
            #mobileQuoteBar,
            #estimateBackdrop,
            #closeEstimateButton,
            #customItemModal,
            .print-hide {
                display: none !important;
            }

            main {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
            }

            #estimatePanel {
                position: static !important;
                display: flex !important;
                transform: none !important;
                width: 100% !important;
                height: auto !important;
                max-height: none !important;
                background: white !important;
                box-shadow: none !important;
                border: 0 !important;
            }

            #estimatePanel::before {
                content: "ASBC Project Labor Estimate";
                display: block;
                font-size: 24px;
                font-weight: bold;
                text-align: center;
                margin-bottom: 20px;
                padding-bottom: 10px;
                border-bottom: 2px solid black;
            }

            #projectTools, #savedEstimateControls { display: none !important; }
            #projectInfoPrint, #categoryBreakdown { display: block !important; }
            #quoteList { overflow: visible !important; }
            #quoteList > div {
                background: white !important;
                border: 1px solid #ddd !important;
            }
            * { color: black !important; }
        }
    </style>
</head>

        // Version 2 uses the original working quote pattern:
        // find an existing item, increase qty, otherwise push a copied catalog item.
        let quoteCart = [];
        let selectedCategory = 'All';
        let favoritesOnly = false;
        let favoriteIds = new Set(JSON.parse(localStorage.getItem('asbcFavoriteIds') || '[]'));

        const currencyFormatter = new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

        const searchInput = document.getElementById('searchInput');
        const productGrid = document.getElementById('productGrid');
        const quoteList = document.getElementById('quoteList');
        const categoryButtons = document.getElementById('categoryButtons');
        const favoritesFilterButton = document.getElementById('favoritesFilterButton');
        const recyclingToggle = document.getElementById('recyclingToggle');
        const materialsMarkup = document.getElementById('materialsMarkup');
        const customerName = document.getElementById('customerName');
        const savedEstimates = document.getElementById('savedEstimates');

        function getSavedEstimateMap() {
            try { return JSON.parse(localStorage.getItem('asbcSavedEstimates') || '{}'); }
            catch (error) { return {}; }
        }

        function refreshSavedEstimateList(selectedId = '') {
            const saved = getSavedEstimateMap();
            savedEstimates.innerHTML = '<option value="">Saved quotes...</option>';
            Object.values(saved)
                .sort((a, b) => a.label.localeCompare(b.label))
                .forEach(record => {
                    const option = document.createElement('option');
                    option.value = record.id;
                    option.textContent = record.label;
                    savedEstimates.appendChild(option);
                });
            savedEstimates.value = selectedId;
        }

        function currentProjectData() {
            return {
                customerName: customerName.value.trim()
            };
        }

        function applyProjectData(data = {}) {
            customerName.value = data.customerName || '';
        }


        function saveEstimate() {
            const data = currentProjectData();
            if (!data.customerName) {
                alert('Enter a customer name before saving.');
                return;
            }
            const saved = getSavedEstimateMap();
            const existingId = savedEstimates.value;
            const id = existingId || `estimate-${Date.now()}`;
            const label = data.customerName;
            saved[id] = {
                id,
                label,
                project: data,
                quoteCart,
                options: {
                    recycling: recyclingToggle.value,
                    markup: materialsMarkup.value
                }
            };
            localStorage.setItem('asbcSavedEstimates', JSON.stringify(saved));
            refreshSavedEstimateList(id);
            alert(`Saved: ${label}`);
        }

        function loadEstimate() {
            const id = savedEstimates.value;
            if (!id) return alert('Choose a saved quote first.');
            const record = getSavedEstimateMap()[id];
            if (!record) return alert('Saved quote not found.');
            quoteCart = Array.isArray(record.quoteCart) ? record.quoteCart : [];
            applyProjectData(record.project);
            recyclingToggle.value = record.options?.recycling || 'no';
            materialsMarkup.value = record.options?.markup || '0';
            renderCatalog();
            renderQuote();
        }

        function deleteEstimate() {
            const id = savedEstimates.value;
            if (!id) return alert('Choose a saved quote first.');
            const saved = getSavedEstimateMap();
            const label = saved[id]?.label || 'this estimate';
            if (!window.confirm(`Delete ${label}?`)) return;
            delete saved[id];
            localStorage.setItem('asbcSavedEstimates', JSON.stringify(saved));
            refreshSavedEstimateList();
        }



        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[character]));
        }

        function buildCategoryButtons() {
            const categories = ['All', ...new Set(catalog.map(item => item.category))];
            categoryButtons.innerHTML = '';

            categories.forEach(category => {
                const button = document.createElement('button');
                button.type = 'button';
                button.textContent = category;
                button.className = 'category-button shrink-0 min-h-10 px-4 rounded-full border border-[#242424] bg-[#0F0F0F] text-white text-sm transition-colors duration-200 hover:border-[#555555]';
                button.dataset.category = category;
                button.addEventListener('click', () => {
                    selectedCategory = category;
                    updateCategoryButtonStyles();
                    renderCatalog();
                });
                categoryButtons.appendChild(button);
            });

            updateCategoryButtonStyles();
        }

        function updateCategoryButtonStyles() {
            document.querySelectorAll('.category-button').forEach(button => {
                button.classList.toggle('category-active', button.dataset.category === selectedCategory);
            });
        }

        function getVisibleCatalogItems() {
            const searchText = searchInput.value.trim().toLowerCase();

            return catalog.filter(item => {
                const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory;
                const matchesSearch = !searchText || `${item.name} ${item.category}`.toLowerCase().includes(searchText);
                const matchesFavorite = !favoritesOnly || favoriteIds.has(item.id);
                return matchesCategory && matchesSearch && matchesFavorite;
            });
        }

        function renderCatalog() {
            const visibleItems = getVisibleCatalogItems();
            productGrid.innerHTML = '';
            document.getElementById('resultCount').textContent = `${visibleItems.length} product${visibleItems.length === 1 ? '' : 's'}`;

            if (visibleItems.length === 0) {
                productGrid.innerHTML = '<div class="col-span-full text-center text-textMuted py-12">No matching products.</div>';
                return;
            }

            visibleItems.forEach(item => {
                const quoteItem = quoteCart.find(cartItem => cartItem.id === item.id && !cartItem.isCustom);
                const quantity = quoteItem ? quoteItem.qty : 0;
                const card = document.createElement('article');
                card.className = 'bg-gray-900 border border-gray-700 rounded-xl p-3 flex flex-col justify-between hover:border-brandGold transition-colors';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between gap-3">
                            <div class="text-xs text-brandGold mb-1 uppercase tracking-wider">${escapeHtml(item.category)}</div>
                            <button
                                type="button"
                                data-favorite-id="${item.id}"
                                class="favorite-button -mt-1.5 -mr-1.5 w-9 h-9 text-lg ${favoriteIds.has(item.id) ? 'text-brandGold' : 'text-textMuted'}"
                                aria-label="Favorite ${escapeHtml(item.name)}"
                            >${favoriteIds.has(item.id) ? '★' : '☆'}</button>
                        </div>
                        <h3 class="font-medium text-sm leading-snug mb-2">${escapeHtml(item.name)}</h3>
                    </div>
                    <div class="flex justify-between items-center gap-2 border-t border-gray-800 pt-2.5">
                        <div class="text-xs text-textMuted font-mono">
                            ${item.installHours.toFixed(2)} install + ${item.programmingHours.toFixed(2)} prog
                        </div>
                        <div class="flex items-center bg-gray-800 rounded-xl overflow-hidden shrink-0">
                            <button type="button" data-product-id="${item.id}" data-change="-1" class="quantity-button w-9 h-9 text-lg" aria-label="Decrease quantity">−</button>
                            <span class="w-7 text-center text-sm font-mono font-bold">${quantity}</span>
                            <button type="button" data-product-id="${item.id}" data-change="1" class="quantity-button w-9 h-9 text-lg hover:bg-brandGold hover:text-bgDark" aria-label="Increase quantity">+</button>
                        </div>
                    </div>
                `;

                productGrid.appendChild(card);
            });
        }

        // Original working quote logic, preserved and made explicit.
        function addToQuote(catalogIndex) {
            const item = catalog[catalogIndex];
            const existingItem = quoteCart.find(cartItem => cartItem.id === item.id && !cartItem.isCustom);

            if (existingItem) {
                existingItem.qty += 1;
            } else {
                quoteCart.push({ ...item, qty: 1, isCustom: false });
            }

            renderCatalog();
            renderQuote();
        }

        function updateProductQuantity(catalogIndex, change) {
            if (change > 0) {
                addToQuote(catalogIndex);
                return;
            }

            const existingIndex = quoteCart.findIndex(cartItem => cartItem.id === catalogIndex && !cartItem.isCustom);
            if (existingIndex === -1) return;

            quoteCart[existingIndex].qty -= 1;
            if (quoteCart[existingIndex].qty <= 0) {
                quoteCart.splice(existingIndex, 1);
            }

            renderCatalog();
            renderQuote();
        }

        function updateQuoteQuantity(quoteIndex, change) {
            quoteCart[quoteIndex].qty += change;
            if (quoteCart[quoteIndex].qty <= 0) {
                quoteCart.splice(quoteIndex, 1);
            }

            renderCatalog();
            renderQuote();
        }

        function renderQuote() {
            let totalInstall = 0;
            let totalProgramming = 0;
            let totalQuantity = 0;
            quoteList.innerHTML = '';

            if (quoteCart.length === 0) {
                quoteList.innerHTML = '<div class="text-textMuted text-center mt-10 italic">No items added yet.</div>';
            } else {
                quoteCart.forEach((item, quoteIndex) => {
                    totalInstall += item.installHours * item.qty;
                    totalProgramming += item.programmingHours * item.qty;
                    totalQuantity += item.qty;

                    const row = document.createElement('div');
                    row.className = 'bg-gray-900 p-3 rounded-xl border border-gray-800 flex justify-between items-center';
                    row.innerHTML = `
                        <div class="flex-1 pr-3">
                            <div class="text-sm font-medium leading-tight mb-1 text-brandGold">${escapeHtml(item.name)}</div>
                            <div class="text-xs text-textMuted font-mono">${(item.totalHours * item.qty).toFixed(2)} hrs</div>
                        </div>
                        <div class="flex items-center bg-gray-800 rounded-lg print-hide">
                            <button type="button" data-quote-index="${quoteIndex}" data-change="-1" class="quote-quantity-button w-10 h-10 text-lg">−</button>
                            <span class="w-7 text-center font-mono">${item.qty}</span>
                            <button type="button" data-quote-index="${quoteIndex}" data-change="1" class="quote-quantity-button w-10 h-10 text-lg">+</button>
                        </div>
                    `;
                    quoteList.appendChild(row);
                });
            }

            const totalHours = totalInstall + totalProgramming;
            const baseLaborPrice = totalHours * HOURLY_RATE;
            const recyclingFee = recyclingToggle.value === 'yes' ? RECYCLING_FEE : 0;
            const markupPercent = Number(materialsMarkup.value) || 0;
            const materialsFee = baseLaborPrice * (markupPercent / 100);
            const finalPrice = baseLaborPrice + recyclingFee + materialsFee;

            document.getElementById('installTotal').textContent = totalInstall.toFixed(2);
            document.getElementById('programmingTotal').textContent = totalProgramming.toFixed(2);
            document.getElementById('hoursTotal').textContent = totalHours.toFixed(2);
            document.getElementById('priceTotal').textContent = currencyFormatter.format(finalPrice);
            document.getElementById('quoteItemCount').textContent = `${totalQuantity} item${totalQuantity === 1 ? '' : 's'}`;
            document.getElementById('mobileItemCount').textContent = totalQuantity;
            document.getElementById('mobileHours').textContent = totalHours.toFixed(2);
            document.getElementById('mobilePrice').textContent = currencyFormatter.format(finalPrice);

            document.getElementById('recyclingRow').classList.toggle('hidden', recyclingFee === 0);
            document.getElementById('materialsRow').classList.toggle('hidden', materialsFee === 0);
            document.getElementById('materialsLabel').textContent = `Materials fee (${markupPercent}%)`;
            document.getElementById('materialsAmount').textContent = currencyFormatter.format(materialsFee);

            const categoryTotals = {};
            quoteCart.forEach(item => {
                categoryTotals[item.category] = (categoryTotals[item.category] || 0) + (item.totalHours * item.qty);
            });
            const breakdown = document.getElementById('categoryBreakdown');
            breakdown.innerHTML = quoteCart.length
                ? '<div class="text-xs uppercase tracking-wider text-textMuted mb-2">Labor by category</div>' +
                  Object.entries(categoryTotals)
                    .sort((a, b) => b[1] - a[1])
                    .map(([category, hours]) => `<div class="flex justify-between text-sm"><span>${escapeHtml(category)}</span><span class="font-mono">${hours.toFixed(2)} hrs</span></div>`)
                    .join('')
                : '';

            const data = currentProjectData();
            document.getElementById('projectInfoPrint').innerHTML = data.customerName
                ? `<div class="mb-4 border-b border-gray-300 pb-3"><strong>Customer / Quote:</strong> ${escapeHtml(data.customerName)}</div>`
                : '';
            document.getElementById('notesPrint').innerHTML = '';
        }

        function toggleFavorite(itemId) {
            if (favoriteIds.has(itemId)) {
                favoriteIds.delete(itemId);
            } else {
                favoriteIds.add(itemId);
            }

            localStorage.setItem('asbcFavoriteIds', JSON.stringify([...favoriteIds]));
            renderCatalog();
        }

        function toggleEstimate(show) {
            document.getElementById('estimatePanel').classList.toggle('estimate-open', show);
            document.getElementById('estimateBackdrop').classList.toggle('hidden', !show);
        }

        function toggleCustomModal(show) {
            const modal = document.getElementById('customItemModal');
            modal.classList.toggle('hidden', !show);
            modal.classList.toggle('flex', show);

            if (show) {
                document.getElementById('customName').value = '';
                document.getElementById('customInstall').value = '';
                document.getElementById('customProgramming').value = '';
                setTimeout(() => document.getElementById('customName').focus(), 50);
            }
        }

        function addCustomItem() {
            const name = document.getElementById('customName').value.trim() || 'Custom Labor';
            const installHours = Number(document.getElementById('customInstall').value) || 0;
            const programmingHours = Number(document.getElementById('customProgramming').value) || 0;

            if (installHours === 0 && programmingHours === 0) {
                alert('Please enter at least some labor hours.');
                return;
            }

            quoteCart.push({
                id: `custom-${Date.now()}`,
                category: 'Custom',
                name,
                installHours,
                programmingHours,
                totalHours: installHours + programmingHours,
                qty: 1,
                isCustom: true
            });

            toggleCustomModal(false);
            renderQuote();
            toggleEstimate(true);
        }

        function clearQuote() {
            if (quoteCart.length === 0 || window.confirm('Clear the entire estimate?')) {
                quoteCart = [];
                renderCatalog();
                renderQuote();
            }
        }

        productGrid.addEventListener('click', event => {
            const quantityButton = event.target.closest('.quantity-button');
            if (quantityButton) {
                const productId = Number(quantityButton.dataset.productId);
                const change = Number(quantityButton.dataset.change);
                updateProductQuantity(productId, change);
                return;
            }

            const favoriteButton = event.target.closest('.favorite-button');
            if (favoriteButton) {
                toggleFavorite(Number(favoriteButton.dataset.favoriteId));
            }
        });

        quoteList.addEventListener('click', event => {
            const button = event.target.closest('.quote-quantity-button');
            if (!button) return;
            updateQuoteQuantity(Number(button.dataset.quoteIndex), Number(button.dataset.change));
        });

        searchInput.addEventListener('input', renderCatalog);

        favoritesFilterButton.addEventListener('click', () => {
            favoritesOnly = !favoritesOnly;
            favoritesFilterButton.classList.toggle('favorites-active', favoritesOnly);
            favoritesFilterButton.textContent = favoritesOnly ? '★ Favorites' : '☆ Favorites';
            renderCatalog();
        });

        [recyclingToggle, materialsMarkup].forEach(control => {
            control.addEventListener('change', renderQuote);
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                toggleCustomModal(false);
                toggleEstimate(false);
            }
        });

        buildCategoryButtons();
        applyProjectData();
        refreshSavedEstimateList();
        customerName.addEventListener('input', renderQuote);
        renderCatalog();
        renderQuote();
    </script>
    <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
