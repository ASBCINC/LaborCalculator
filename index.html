<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0A0A0A">
    <title>Labor Calculator | ASBC</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandGold: '#D4AF37',
                        bgDark: '#0A0A0A',
                        bgPanel: '#171717',
                        textMuted: '#A3A3A3'
                    }
                }
            }
        };
    </script>

    <style>
        html { -webkit-text-size-adjust: 100%; }
        body { overscroll-behavior: none; }
        button, input, select { touch-action: manipulation; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0A0A0A; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }

        .category-active,
        .favorites-active {
            background: #D4AF37 !important;
            border-color: #D4AF37 !important;
            color: #0A0A0A !important;
        }

        .estimate-open { transform: translateY(0) !important; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

        @media print {
            body {
                background: white !important;
                color: black !important;
                height: auto !important;
                overflow: visible !important;
            }

            header,
            #catalogPanel,
            #mobileQuoteBar,
            #estimateBackdrop,
            #closeEstimateButton,
            #customItemModal,
            .print-hide {
                display: none !important;
            }

            main {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
            }

            #estimatePanel {
                position: static !important;
                display: flex !important;
                transform: none !important;
                width: 100% !important;
                height: auto !important;
                max-height: none !important;
                background: white !important;
                box-shadow: none !important;
                border: 0 !important;
            }

            #estimatePanel::before {
                content: "ASBC Project Labor Estimate";
                display: block;
                font-size: 24px;
                font-weight: bold;
                text-align: center;
                margin-bottom: 20px;
                padding-bottom: 10px;
                border-bottom: 2px solid black;
            }

            #projectTools, #savedEstimateControls { display: none !important; }
            #projectInfoPrint, #notesPrint, #categoryBreakdown { display: block !important; }
            #quoteList { overflow: visible !important; }
            #quoteList > div {
                background: white !important;
                border: 1px solid #ddd !important;
            }
            * { color: black !important; }
        }
    </style>
</head>

<body class="bg-bgDark text-white h-screen overflow-hidden font-sans">
    <header class="h-16 bg-bgPanel border-b border-gray-800 px-3 sm:px-4 flex items-center justify-between shadow-md">
        <h1 class="text-lg sm:text-2xl font-light tracking-wide truncate">
            <span class="text-brandGold font-bold">ASBC</span> Labor Calculator
        </h1>
        <div class="text-xs sm:text-sm text-textMuted whitespace-nowrap ml-2">$200/hr</div>
    </header>

    <main class="h-[calc(100vh-4rem)] flex overflow-hidden relative">
        <section id="catalogPanel" class="w-full md:w-2/3 flex flex-col border-r border-gray-800 pb-20 md:pb-0">
            <div class="p-3 sm:p-4 bg-bgPanel border-b border-gray-800 space-y-3 shrink-0">
                <div class="flex gap-2">
                    <input
                        id="searchInput"
                        type="search"
                        autocomplete="off"
                        placeholder="Search 102 products..."
                        class="flex-1 min-w-0 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-base outline-none focus:border-brandGold focus:ring-1 focus:ring-brandGold"
                    >
                    <button
                        type="button"
                        onclick="toggleCustomModal(true)"
                        class="min-h-12 bg-gray-800 border border-gray-700 rounded-xl px-3 sm:px-4 font-medium hover:bg-brandGold hover:text-bgDark"
                    >
                        + Custom
                    </button>
                </div>

                <div id="categoryButtons" class="flex gap-2 overflow-x-auto pb-1"></div>

                <div class="flex justify-between items-center text-xs text-textMuted">
                    <span id="resultCount">0 products</span>
                    <button
                        id="favoritesFilterButton"
                        type="button"
                        class="border border-gray-700 rounded-full px-3 py-1.5"
                    >
                        ☆ Favorites
                    </button>
                </div>
            </div>

            <div
                id="productGrid"
                class="flex-1 overflow-y-auto p-3 sm:p-4 grid grid-cols-1 lg:grid-cols-2 gap-3 sm:gap-4 content-start"
            ></div>
        </section>

        <section
            id="estimatePanel"
            class="fixed md:static inset-x-0 bottom-0 z-40 md:z-auto w-full md:w-1/3 h-[88vh] md:h-full bg-bgPanel flex flex-col overflow-y-auto shadow-2xl md:shadow-none rounded-t-2xl md:rounded-none border-t md:border-t-0 border-gray-700 translate-y-full md:translate-y-0 transition-transform duration-300"
        >
            <div class="sticky top-0 z-20 p-4 border-b border-gray-800 flex justify-between items-center shrink-0 bg-bgPanel">
                <div>
                    <h2 class="text-xl font-semibold text-brandGold">Current Estimate</h2>
                    <p id="quoteItemCount" class="text-xs text-textMuted">0 items</p>
                </div>
                <button
                    id="closeEstimateButton"
                    type="button"
                    onclick="toggleEstimate(false)"
                    class="md:hidden w-11 h-11 bg-gray-800 rounded-full text-xl"
                    aria-label="Close estimate"
                >
                    ×
                </button>
            </div>

            <div id="projectTools" class="p-4 border-b border-gray-800 space-y-3 shrink-0 print-hide">
                <div class="grid grid-cols-2 gap-2">
                    <input id="customerName" type="text" placeholder="Customer name" class="bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm">
                    <input id="projectLocation" type="text" placeholder="Location" class="bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm">
                    <input id="salespersonName" type="text" placeholder="Salesperson" class="bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm">
                    <input id="projectDate" type="date" class="bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm">
                </div>
                <textarea id="projectNotes" rows="2" placeholder="Project notes" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm"></textarea>
                <button type="button" onclick="saveEstimate()" class="w-full bg-brandGold text-bgDark font-bold rounded-lg py-2.5">Save Estimate</button>
                <div id="savedEstimateControls" class="flex gap-2">
                    <select id="savedEstimates" class="flex-1 min-w-0 bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm">
                        <option value="">Saved estimates...</option>
                    </select>
                    <button type="button" onclick="loadEstimate()" class="bg-gray-800 border border-gray-700 rounded-lg px-3">Load</button>
                    <button type="button" onclick="deleteEstimate()" class="bg-gray-800 border border-red-800 text-red-300 rounded-lg px-3">Delete</button>
                </div>
            </div>

            <div id="projectInfoPrint" class="hidden px-4 pt-4 text-sm"></div>
            <div id="quoteList" class="shrink-0 p-4 space-y-3"></div>
            <div id="categoryBreakdown" class="px-4 pb-3"></div>
            <div id="notesPrint" class="hidden px-4 pb-3 text-sm"></div>

            <div class="sticky bottom-0 z-20 p-4 sm:p-6 bg-gray-900 border-t border-gray-800 shrink-0 safe-bottom shadow-[0_-10px_20px_rgba(0,0,0,0.45)]">
                <div class="grid grid-cols-2 gap-3 mb-3 print-hide">
                    <label class="text-xs text-textMuted">
                        Crew size
                        <select id="crewSize" class="mt-1 w-full bg-bgDark border border-gray-700 rounded-lg p-2.5 text-base">
                            <option value="1">1 tech</option>
                            <option value="2" selected>2 techs</option>
                            <option value="3">3 techs</option>
                            <option value="4">4 techs</option>
                        </select>
                    </label>

                    <label class="text-xs text-textMuted">
                        Workday
                        <select id="workdayHours" class="mt-1 w-full bg-bgDark border border-gray-700 rounded-lg p-2.5 text-base">
                            <option value="8" selected>8 hours</option>
                            <option value="10">10 hours</option>
                        </select>
                    </label>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-4 print-hide">
                    <label class="text-xs text-textMuted">
                        Recycling
                        <select id="recyclingToggle" class="mt-1 w-full bg-bgDark border border-gray-700 rounded-lg p-2.5 text-base">
                            <option value="no">No</option>
                            <option value="yes">Yes (+$75)</option>
                        </select>
                    </label>

                    <label class="text-xs text-textMuted">
                        Materials fee
                        <select id="materialsMarkup" class="mt-1 w-full bg-bgDark border border-gray-700 rounded-lg p-2.5 text-base">
                            <option value="0">0%</option>
                            <option value="5">5%</option>
                            <option value="10">10%</option>
                        </select>
                    </label>
                </div>

                <div class="space-y-1.5 text-sm mb-3">
                    <div class="flex justify-between text-textMuted">
                        <span>Install hours</span>
                        <span id="installTotal" class="text-white font-mono">0.00</span>
                    </div>
                    <div class="flex justify-between text-textMuted">
                        <span>Programming hours</span>
                        <span id="programmingTotal" class="text-white font-mono">0.00</span>
                    </div>
                    <div class="flex justify-between text-textMuted">
                        <span>Total labor hours</span>
                        <span id="hoursTotal" class="text-white font-mono">0.00</span>
                    </div>
                    <div class="flex justify-between text-textMuted">
                        <span>Estimated crew days</span>
                        <span id="crewDaysTotal" class="text-white font-mono">0.00</span>
                    </div>
                    <div id="recyclingRow" class="hidden flex justify-between text-brandGold">
                        <span>Recycling fee</span>
                        <span>$75.00</span>
                    </div>
                    <div id="materialsRow" class="hidden flex justify-between text-brandGold">
                        <span id="materialsLabel">Materials fee</span>
                        <span id="materialsAmount">$0.00</span>
                    </div>
                </div>

                <div class="flex justify-between items-end border-t border-gray-700 pt-3 mb-3">
                    <span class="uppercase tracking-wider text-textMuted">Total</span>
                    <span id="priceTotal" class="text-2xl sm:text-3xl font-bold text-brandGold font-mono">$0.00</span>
                </div>

                <div class="grid grid-cols-2 gap-2 print-hide">
                    <button
                        type="button"
                        onclick="clearQuote()"
                        class="border border-gray-700 font-semibold py-3 rounded-xl hover:border-red-500"
                    >
                        Clear
                    </button>
                    <button
                        type="button"
                        onclick="window.print()"
                        class="bg-brandGold text-bgDark font-bold py-3 rounded-xl hover:bg-yellow-500"
                    >
                        Print / PDF
                    </button>
                </div>
            </div>
        </section>
    </main>

    <button
        id="mobileQuoteBar"
        type="button"
        onclick="toggleEstimate(true)"
        class="md:hidden fixed z-30 left-3 right-3 bottom-3 bg-brandGold text-bgDark rounded-2xl shadow-2xl px-4 py-3 flex items-center justify-between font-bold safe-bottom"
    >
        <span><span id="mobileItemCount">0</span> items · <span id="mobileHours">0.00</span> hrs</span>
        <span id="mobilePrice" class="font-mono text-lg">$0.00</span>
    </button>

    <div
        id="estimateBackdrop"
        onclick="toggleEstimate(false)"
        class="hidden md:hidden fixed inset-0 z-30 bg-black/70"
    ></div>

    <div id="customItemModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="bg-bgPanel border border-gray-700 p-5 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-brandGold">Add Custom Labor</h3>
                <button type="button" onclick="toggleCustomModal(false)" class="w-10 h-10 rounded-full bg-gray-800">×</button>
            </div>

            <label class="block text-xs text-textMuted uppercase tracking-wider">
                Description
                <input
                    id="customName"
                    type="text"
                    placeholder="e.g. Core drill concrete wall"
                    class="mt-1 w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-base"
                >
            </label>

            <div class="grid grid-cols-2 gap-3 mt-4">
                <label class="text-xs text-textMuted uppercase tracking-wider">
                    Install hrs
                    <input id="customInstall" type="number" inputmode="decimal" min="0" step="0.25" placeholder="0" class="mt-1 w-full min-w-0 bg-gray-900 border border-gray-700 rounded-xl p-3 text-base">
                </label>
                <label class="text-xs text-textMuted uppercase tracking-wider">
                    Programming hrs
                    <input id="customProgramming" type="number" inputmode="decimal" min="0" step="0.25" placeholder="0" class="mt-1 w-full min-w-0 bg-gray-900 border border-gray-700 rounded-xl p-3 text-base">
                </label>
            </div>

            <button
                type="button"
                onclick="addCustomItem()"
                class="mt-5 w-full bg-brandGold text-bgDark font-bold py-3.5 rounded-xl"
            >
                Add to Estimate
            </button>
        </div>
    </div>

        // Version 2 uses the original working quote pattern:
        // find an existing item, increase qty, otherwise push a copied catalog item.
        let quoteCart = [];
        let selectedCategory = 'All';
        let favoritesOnly = false;
        let favoriteIds = new Set(JSON.parse(localStorage.getItem('asbcFavoriteIds') || '[]'));

        const currencyFormatter = new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

        const searchInput = document.getElementById('searchInput');
        const productGrid = document.getElementById('productGrid');
        const quoteList = document.getElementById('quoteList');
        const categoryButtons = document.getElementById('categoryButtons');
        const favoritesFilterButton = document.getElementById('favoritesFilterButton');
        const recyclingToggle = document.getElementById('recyclingToggle');
        const materialsMarkup = document.getElementById('materialsMarkup');
        const crewSize = document.getElementById('crewSize');
        const workdayHours = document.getElementById('workdayHours');
        const customerName = document.getElementById('customerName');
        const projectLocation = document.getElementById('projectLocation');
        const salespersonName = document.getElementById('salespersonName');
        const projectDate = document.getElementById('projectDate');
        const projectNotes = document.getElementById('projectNotes');
        const savedEstimates = document.getElementById('savedEstimates');

        function getSavedEstimateMap() {
            try { return JSON.parse(localStorage.getItem('asbcSavedEstimates') || '{}'); }
            catch (error) { return {}; }
        }

        function refreshSavedEstimateList(selectedId = '') {
            const saved = getSavedEstimateMap();
            savedEstimates.innerHTML = '<option value="">Saved estimates...</option>';
            Object.values(saved)
                .sort((a, b) => a.label.localeCompare(b.label))
                .forEach(record => {
                    const option = document.createElement('option');
                    option.value = record.id;
                    option.textContent = record.label;
                    savedEstimates.appendChild(option);
                });
            savedEstimates.value = selectedId;
        }

        function currentProjectData() {
            return {
                customerName: customerName.value.trim(),
                projectLocation: projectLocation.value.trim(),
                salespersonName: salespersonName.value.trim(),
                projectDate: projectDate.value,
                projectNotes: projectNotes.value.trim()
            };
        }

        function applyProjectData(data = {}) {
            customerName.value = data.customerName || '';
            projectLocation.value = data.projectLocation || '';
            salespersonName.value = data.salespersonName || '';
            projectDate.value = data.projectDate || new Date().toISOString().slice(0, 10);
            projectNotes.value = data.projectNotes || '';
        }


        function saveEstimate() {
            const data = currentProjectData();
            if (!data.customerName) {
                alert('Enter a customer name before saving.');
                return;
            }
            const saved = getSavedEstimateMap();
            const existingId = savedEstimates.value;
            const id = existingId || `estimate-${Date.now()}`;
            const label = [data.customerName, data.projectLocation].filter(Boolean).join(' - ');
            saved[id] = {
                id,
                label,
                project: data,
                quoteCart,
                options: {
                    recycling: recyclingToggle.value,
                    markup: materialsMarkup.value,
                    crew: crewSize.value,
                    workday: workdayHours.value
                }
            };
            localStorage.setItem('asbcSavedEstimates', JSON.stringify(saved));
            refreshSavedEstimateList(id);
            alert(`Saved: ${label}`);
        }

        function loadEstimate() {
            const id = savedEstimates.value;
            if (!id) return alert('Choose a saved estimate first.');
            const record = getSavedEstimateMap()[id];
            if (!record) return alert('Saved estimate not found.');
            quoteCart = Array.isArray(record.quoteCart) ? record.quoteCart : [];
            applyProjectData(record.project);
            recyclingToggle.value = record.options?.recycling || 'no';
            materialsMarkup.value = record.options?.markup || '0';
            crewSize.value = record.options?.crew || '2';
            workdayHours.value = record.options?.workday || '8';
            renderCatalog();
            renderQuote();
        }

        function deleteEstimate() {
            const id = savedEstimates.value;
            if (!id) return alert('Choose a saved estimate first.');
            const saved = getSavedEstimateMap();
            const label = saved[id]?.label || 'this estimate';
            if (!window.confirm(`Delete ${label}?`)) return;
            delete saved[id];
            localStorage.setItem('asbcSavedEstimates', JSON.stringify(saved));
            refreshSavedEstimateList();
        }



        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[character]));
        }

        function buildCategoryButtons() {
            const categories = ['All', ...new Set(catalog.map(item => item.category))];
            categoryButtons.innerHTML = '';

            categories.forEach(category => {
                const button = document.createElement('button');
                button.type = 'button';
                button.textContent = category;
                button.className = 'category-button shrink-0 min-h-10 px-4 rounded-full border border-gray-700 bg-gray-900 text-sm';
                button.dataset.category = category;
                button.addEventListener('click', () => {
                    selectedCategory = category;
                    updateCategoryButtonStyles();
                    renderCatalog();
                });
                categoryButtons.appendChild(button);
            });

            updateCategoryButtonStyles();
        }

        function updateCategoryButtonStyles() {
            document.querySelectorAll('.category-button').forEach(button => {
                button.classList.toggle('category-active', button.dataset.category === selectedCategory);
            });
        }

        function getVisibleCatalogItems() {
            const searchText = searchInput.value.trim().toLowerCase();

            return catalog.filter(item => {
                const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory;
                const matchesSearch = !searchText || `${item.name} ${item.category}`.toLowerCase().includes(searchText);
                const matchesFavorite = !favoritesOnly || favoriteIds.has(item.id);
                return matchesCategory && matchesSearch && matchesFavorite;
            });
        }

        function renderCatalog() {
            const visibleItems = getVisibleCatalogItems();
            productGrid.innerHTML = '';
            document.getElementById('resultCount').textContent = `${visibleItems.length} product${visibleItems.length === 1 ? '' : 's'}`;

            if (visibleItems.length === 0) {
                productGrid.innerHTML = '<div class="col-span-full text-center text-textMuted py-12">No matching products.</div>';
                return;
            }

            visibleItems.forEach(item => {
                const quoteItem = quoteCart.find(cartItem => cartItem.id === item.id && !cartItem.isCustom);
                const quantity = quoteItem ? quoteItem.qty : 0;
                const card = document.createElement('article');
                card.className = 'bg-gray-900 border border-gray-700 rounded-2xl p-4 flex flex-col justify-between hover:border-brandGold transition-colors';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between gap-3">
                            <div class="text-xs text-brandGold mb-1 uppercase tracking-wider">${escapeHtml(item.category)}</div>
                            <button
                                type="button"
                                data-favorite-id="${item.id}"
                                class="favorite-button -mt-2 -mr-2 w-11 h-11 text-xl ${favoriteIds.has(item.id) ? 'text-brandGold' : 'text-textMuted'}"
                                aria-label="Favorite ${escapeHtml(item.name)}"
                            >${favoriteIds.has(item.id) ? '★' : '☆'}</button>
                        </div>
                        <h3 class="font-medium text-base leading-snug mb-3">${escapeHtml(item.name)}</h3>
                    </div>
                    <div class="flex justify-between items-center gap-2 border-t border-gray-800 pt-3">
                        <div class="text-xs text-textMuted font-mono">
                            ${item.installHours.toFixed(2)} install + ${item.programmingHours.toFixed(2)} prog
                        </div>
                        <div class="flex items-center bg-gray-800 rounded-xl overflow-hidden shrink-0">
                            <button type="button" data-product-id="${item.id}" data-change="-1" class="quantity-button w-11 h-11 text-xl" aria-label="Decrease quantity">−</button>
                            <span class="w-8 text-center font-mono font-bold">${quantity}</span>
                            <button type="button" data-product-id="${item.id}" data-change="1" class="quantity-button w-11 h-11 text-xl hover:bg-brandGold hover:text-bgDark" aria-label="Increase quantity">+</button>
                        </div>
                    </div>
                `;

                productGrid.appendChild(card);
            });
        }

        // Original working quote logic, preserved and made explicit.
        function addToQuote(catalogIndex) {
            const item = catalog[catalogIndex];
            const existingItem = quoteCart.find(cartItem => cartItem.id === item.id && !cartItem.isCustom);

            if (existingItem) {
                existingItem.qty += 1;
            } else {
                quoteCart.push({ ...item, qty: 1, isCustom: false });
            }

            renderCatalog();
            renderQuote();
        }

        function updateProductQuantity(catalogIndex, change) {
            if (change > 0) {
                addToQuote(catalogIndex);
                return;
            }

            const existingIndex = quoteCart.findIndex(cartItem => cartItem.id === catalogIndex && !cartItem.isCustom);
            if (existingIndex === -1) return;

            quoteCart[existingIndex].qty -= 1;
            if (quoteCart[existingIndex].qty <= 0) {
                quoteCart.splice(existingIndex, 1);
            }

            renderCatalog();
            renderQuote();
        }

        function updateQuoteQuantity(quoteIndex, change) {
            quoteCart[quoteIndex].qty += change;
            if (quoteCart[quoteIndex].qty <= 0) {
                quoteCart.splice(quoteIndex, 1);
            }

            renderCatalog();
            renderQuote();
        }

        function renderQuote() {
            let totalInstall = 0;
            let totalProgramming = 0;
            let totalQuantity = 0;
            quoteList.innerHTML = '';

            if (quoteCart.length === 0) {
                quoteList.innerHTML = '<div class="text-textMuted text-center mt-10 italic">No items added yet.</div>';
            } else {
                quoteCart.forEach((item, quoteIndex) => {
                    totalInstall += item.installHours * item.qty;
                    totalProgramming += item.programmingHours * item.qty;
                    totalQuantity += item.qty;

                    const row = document.createElement('div');
                    row.className = 'bg-gray-900 p-3 rounded-xl border border-gray-800 flex justify-between items-center';
                    row.innerHTML = `
                        <div class="flex-1 pr-3">
                            <div class="text-sm font-medium leading-tight mb-1 text-brandGold">${escapeHtml(item.name)}</div>
                            <div class="text-xs text-textMuted font-mono">${(item.totalHours * item.qty).toFixed(2)} hrs</div>
                        </div>
                        <div class="flex items-center bg-gray-800 rounded-lg print-hide">
                            <button type="button" data-quote-index="${quoteIndex}" data-change="-1" class="quote-quantity-button w-10 h-10 text-lg">−</button>
                            <span class="w-7 text-center font-mono">${item.qty}</span>
                            <button type="button" data-quote-index="${quoteIndex}" data-change="1" class="quote-quantity-button w-10 h-10 text-lg">+</button>
                        </div>
                    `;
                    quoteList.appendChild(row);
                });
            }

            const totalHours = totalInstall + totalProgramming;
            const baseLaborPrice = totalHours * HOURLY_RATE;
            const recyclingFee = recyclingToggle.value === 'yes' ? RECYCLING_FEE : 0;
            const markupPercent = Number(materialsMarkup.value) || 0;
            const materialsFee = baseLaborPrice * (markupPercent / 100);
            const finalPrice = baseLaborPrice + recyclingFee + materialsFee;
            const selectedCrewSize = Number(crewSize.value) || 1;
            const selectedWorkdayHours = Number(workdayHours.value) || 8;
            const estimatedCrewDays = totalHours / (selectedCrewSize * selectedWorkdayHours);

            document.getElementById('installTotal').textContent = totalInstall.toFixed(2);
            document.getElementById('programmingTotal').textContent = totalProgramming.toFixed(2);
            document.getElementById('hoursTotal').textContent = totalHours.toFixed(2);
            document.getElementById('crewDaysTotal').textContent = estimatedCrewDays.toFixed(2);
            document.getElementById('priceTotal').textContent = currencyFormatter.format(finalPrice);
            document.getElementById('quoteItemCount').textContent = `${totalQuantity} item${totalQuantity === 1 ? '' : 's'}`;
            document.getElementById('mobileItemCount').textContent = totalQuantity;
            document.getElementById('mobileHours').textContent = totalHours.toFixed(2);
            document.getElementById('mobilePrice').textContent = currencyFormatter.format(finalPrice);

            document.getElementById('recyclingRow').classList.toggle('hidden', recyclingFee === 0);
            document.getElementById('materialsRow').classList.toggle('hidden', materialsFee === 0);
            document.getElementById('materialsLabel').textContent = `Materials fee (${markupPercent}%)`;
            document.getElementById('materialsAmount').textContent = currencyFormatter.format(materialsFee);

            const categoryTotals = {};
            quoteCart.forEach(item => {
                categoryTotals[item.category] = (categoryTotals[item.category] || 0) + (item.totalHours * item.qty);
            });
            const breakdown = document.getElementById('categoryBreakdown');
            breakdown.innerHTML = quoteCart.length
                ? '<div class="text-xs uppercase tracking-wider text-textMuted mb-2">Labor by category</div>' +
                  Object.entries(categoryTotals)
                    .sort((a, b) => b[1] - a[1])
                    .map(([category, hours]) => `<div class="flex justify-between text-sm"><span>${escapeHtml(category)}</span><span class="font-mono">${hours.toFixed(2)} hrs</span></div>`)
                    .join('')
                : '';

            const data = currentProjectData();
            document.getElementById('projectInfoPrint').innerHTML = `
                <div class="grid grid-cols-2 gap-x-6 gap-y-1 mb-4 border-b border-gray-300 pb-3">
                    <div><strong>Customer:</strong> ${escapeHtml(data.customerName || '—')}</div>
                    <div><strong>Location:</strong> ${escapeHtml(data.projectLocation || '—')}</div>
                    <div><strong>Salesperson:</strong> ${escapeHtml(data.salespersonName || '—')}</div>
                    <div><strong>Date:</strong> ${escapeHtml(data.projectDate || '—')}</div>
                </div>`;
            document.getElementById('notesPrint').innerHTML = data.projectNotes
                ? `<h3 class="font-bold mb-1">Project Notes</h3><p class="whitespace-pre-wrap">${escapeHtml(data.projectNotes)}</p>`
                : '';
        }

        function toggleFavorite(itemId) {
            if (favoriteIds.has(itemId)) {
                favoriteIds.delete(itemId);
            } else {
                favoriteIds.add(itemId);
            }

            localStorage.setItem('asbcFavoriteIds', JSON.stringify([...favoriteIds]));
            renderCatalog();
        }

        function toggleEstimate(show) {
            document.getElementById('estimatePanel').classList.toggle('estimate-open', show);
            document.getElementById('estimateBackdrop').classList.toggle('hidden', !show);
        }

        function toggleCustomModal(show) {
            const modal = document.getElementById('customItemModal');
            modal.classList.toggle('hidden', !show);
            modal.classList.toggle('flex', show);

            if (show) {
                document.getElementById('customName').value = '';
                document.getElementById('customInstall').value = '';
                document.getElementById('customProgramming').value = '';
                setTimeout(() => document.getElementById('customName').focus(), 50);
            }
        }

        function addCustomItem() {
            const name = document.getElementById('customName').value.trim() || 'Custom Labor';
            const installHours = Number(document.getElementById('customInstall').value) || 0;
            const programmingHours = Number(document.getElementById('customProgramming').value) || 0;

            if (installHours === 0 && programmingHours === 0) {
                alert('Please enter at least some labor hours.');
                return;
            }

            quoteCart.push({
                id: `custom-${Date.now()}`,
                category: 'Custom',
                name,
                installHours,
                programmingHours,
                totalHours: installHours + programmingHours,
                qty: 1,
                isCustom: true
            });

            toggleCustomModal(false);
            renderQuote();
            toggleEstimate(true);
        }

        function clearQuote() {
            if (quoteCart.length === 0 || window.confirm('Clear the entire estimate?')) {
                quoteCart = [];
                renderCatalog();
                renderQuote();
            }
        }

        productGrid.addEventListener('click', event => {
            const quantityButton = event.target.closest('.quantity-button');
            if (quantityButton) {
                const productId = Number(quantityButton.dataset.productId);
                const change = Number(quantityButton.dataset.change);
                updateProductQuantity(productId, change);
                return;
            }

            const favoriteButton = event.target.closest('.favorite-button');
            if (favoriteButton) {
                toggleFavorite(Number(favoriteButton.dataset.favoriteId));
            }
        });

        quoteList.addEventListener('click', event => {
            const button = event.target.closest('.quote-quantity-button');
            if (!button) return;
            updateQuoteQuantity(Number(button.dataset.quoteIndex), Number(button.dataset.change));
        });

        searchInput.addEventListener('input', renderCatalog);

        favoritesFilterButton.addEventListener('click', () => {
            favoritesOnly = !favoritesOnly;
            favoritesFilterButton.classList.toggle('favorites-active', favoritesOnly);
            favoritesFilterButton.textContent = favoritesOnly ? '★ Favorites' : '☆ Favorites';
            renderCatalog();
        });

        [recyclingToggle, materialsMarkup, crewSize, workdayHours].forEach(control => {
            control.addEventListener('change', renderQuote);
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                toggleCustomModal(false);
                toggleEstimate(false);
            }
        });

        buildCategoryButtons();
        applyProjectData({ projectDate: new Date().toISOString().slice(0, 10) });
        refreshSavedEstimateList();
        [customerName, projectLocation, salespersonName, projectDate, projectNotes].forEach(control => {
            control.addEventListener('input', renderQuote);
        });
        renderCatalog();
        renderQuote();
    </script>
