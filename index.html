    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandGold: '#D4AF37',
                        bgDark: '#0A0A0A',
                        bgPanel: '#171717',
                        textMuted: '#A3A3A3'
                    }
                }
            }
        }

    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0A0A0A; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }

<body class="bg-bgDark text-white h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-bgPanel border-b border-gray-800 p-4 flex justify-between items-center shadow-md shrink-0">
        <h1 class="text-2xl font-light tracking-wide"><span class="text-brandGold font-bold">ASBC</span> Labor Calculator</h1>
        <div class="text-sm text-textMuted bg-gray-900 px-3 py-1 rounded-full border border-gray-700">
            Rate: <span class="text-white font-mono">$200/hr</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Left Panel: Catalog -->

            <!-- Filter Bar -->
            <div class="p-4 bg-bgPanel border-b border-gray-800 shrink-0">
                <select id="categoryFilter" class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg focus:ring-brandGold focus:border-brandGold block p-2.5 outline-none transition-colors">
                    <option value="All">All Categories</option>
                    <!-- Categories injected by JS -->
                </select>
            </div>

            <!-- Product Grid -->
            <div id="productGrid" class="flex-1 overflow-y-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-4 content-start">
                <!-- Items injected by JS -->
            </div>
        </section>

        <!-- Right Panel: Estimate -->
        <section class="w-1/3 bg-bgPanel flex flex-col relative shadow-l">
            <div class="p-4 border-b border-gray-800 shrink-0">
                <h2 class="text-xl font-semibold tracking-wide text-brandGold">Current Estimate</h2>
            </div>
            
            <!-- Cart Items -->
            <div id="cartList" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="text-textMuted text-center mt-10 italic">No items added yet.</div>
            </div>

            <!-- Footer Totals -->
            <div class="p-6 bg-gray-900 border-t border-gray-800 shrink-0 shadow-[0_-10px_20px_rgba(0,0,0,0.5)]">
                <div class="flex justify-between text-sm text-textMuted mb-2">
                    <span>Install Hours:</span>
                    <span id="installTotal" class="text-white font-mono">0.0</span>
                </div>
                <div class="flex justify-between text-sm text-textMuted mb-2">
                    <span>Programming Hours:</span>
                    <span id="progTotal" class="text-white font-mono">0.0</span>
                </div>
                <div class="flex justify-between text-sm text-textMuted mb-4">
                    <span>Total Hours:</span>
                    <span id="hoursTotal" class="text-white font-mono">0.0</span>
                </div>
                <div class="flex justify-between items-end border-t border-gray-700 pt-4">
                    <span class="text-lg uppercase tracking-wider text-textMuted">Total Labor</span>
                    <span id="priceTotal" class="text-3xl font-bold text-brandGold font-mono">$0</span>
                </div>
            </div>
        </section>
    </main>

        let cart = {};

        // Populate Categories
        const categories = [...new Set(catalog.map(item => item.category))].sort();
        const filterSelect = document.getElementById('categoryFilter');
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            filterSelect.appendChild(opt);
        });

        function renderCatalog(filter = 'All') {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            catalog.forEach((item, index) => {
                if (filter !== 'All' && item.category !== filter) return;

                const card = document.createElement('div');
                card.className = "bg-gray-900 border border-gray-700 rounded-lg p-4 flex flex-col justify-between hover:border-brandGold transition-colors";
                
                card.innerHTML = `
                    <div>
                        <div class="text-xs text-brandGold mb-1 uppercase tracking-wider">${item.category}</div>
                        <h3 class="font-medium text-sm mb-3 leading-tight">${item.name}</h3>
                    </div>
                    <div class="flex justify-between items-center mt-2 border-t border-gray-800 pt-3">
                        <div class="text-xs text-textMuted font-mono">
                            ${item.totalHours} Hrs
                        </div>
                        <button onclick="addToCart(${index})" class="bg-gray-800 hover:bg-brandGold hover:text-bgDark text-white px-3 py-1 rounded text-sm transition-colors font-medium">
                            + Add
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(index) {
            if (cart[index]) {
                cart[index].qty++;
            } else {
                cart[index] = { ...catalog[index], qty: 1 };
            }
            renderCart();
        }

        function updateQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                delete cart[index];
            }
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cartList');
            let totalInstall = 0;
            let totalProg = 0;
            
            cartList.innerHTML = '';
            
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                cartList.innerHTML = '<div class="text-textMuted text-center mt-10 italic">No items added yet.</div>';
            } else {
                keys.forEach(key => {
                    const item = cart[key];
                    totalInstall += item.installHours * item.qty;
                    totalProg += item.programmingHours * item.qty;
                    
                    const row = document.createElement('div');
                    row.className = "bg-gray-900 p-3 rounded-lg border border-gray-800 flex justify-between items-center";
                    
                    row.innerHTML = `
                        <div class="flex-1 pr-3">
                            <div class="text-sm font-medium leading-tight mb-1">${item.name}</div>
                            <div class="text-xs text-textMuted font-mono">${(item.totalHours * item.qty).toFixed(2)} Hrs</div>
                        </div>
                        <div class="flex items-center space-x-2 bg-gray-800 rounded p-1">
                            <button onclick="updateQty(${key}, -1)" class="w-6 h-6 flex items-center justify-center text-textMuted hover:text-white hover:bg-gray-700 rounded">-</button>
                            <span class="text-sm font-mono w-4 text-center">${item.qty}</span>
                            <button onclick="updateQty(${key}, 1)" class="w-6 h-6 flex items-center justify-center text-textMuted hover:text-white hover:bg-gray-700 rounded">+</button>
                        </div>
                    `;
                    cartList.appendChild(row);
                });
            }

            const totalHrs = totalInstall + totalProg;
            const totalPrice = totalHrs * HOURLY_RATE;

            document.getElementById('installTotal').textContent = totalInstall.toFixed(2);
            document.getElementById('progTotal').textContent = totalProg.toFixed(2);
            document.getElementById('hoursTotal').textContent = totalHrs.toFixed(2);
            
            // Format currency
            document.getElementById('priceTotal').textContent = new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(totalPrice);
        }

        // Init
        document.getElementById('categoryFilter').addEventListener('change', (e) => {
            renderCatalog(e.target.value);
        });
        renderCatalog();

    </script>
</body>
</html>
