  <title>
   ASBC Labor Calculator
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <script>
   tailwind.config = {
  theme: {
    extend: {
      colors: {
        gold: '#d4af37',
        ink: '#0a0a0a',
        panel: '#171717',
        muted: '#a3a3a3'
      }
    }
  }
}
  </script>

   html{-webkit-text-size-adjust:100%}button,input,select{touch-action:manipulation}.active{background:#d4af37!important;color:#0a0a0a!important;border-color:#d4af37!important}.open{transform:translateY(0)!important}.safe{padding-bottom:env(safe-area-inset-bottom)}@media print{header,#catalog,#mobileBar,#backdrop,.no-print{display:none!important}main{display:block!important;height:auto!important}#estimate{position:static!important;transform:none!important;width:100%!important;height:auto!important;background:white!important;color:black!important}#cart{overflow:visible!important}#cart>div{background:white!important;color:black!important;border:1px solid #ddd!important}}

 </head>
 <body class="bg-ink text-white h-screen overflow-hidden font-sans">
  <header class="h-16 bg-panel border-b border-gray-800 px-4 flex items-center justify-between">
   <h1 class="text-xl sm:text-2xl">
    <b class="text-gold">
     ASBC
    </b>
    Labor Calculator
   </h1>
   <span class="text-sm text-muted">
    $200/hr
   </span>
  </header>
  <main class="h-[calc(100vh-4rem)] flex overflow-hidden relative">
   <section class="w-full md:w-2/3 flex flex-col pb-20 md:pb-0" id="catalog">
    <div class="p-3 bg-panel border-b border-gray-800 space-y-3">
     <div class="flex gap-2">
      <input class="flex-1 min-w-0 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-base outline-none focus:border-gold" id="search" placeholder="Search 102 products..." type="search"/>
      <button class="bg-gray-800 border border-gray-700 rounded-xl px-4" onclick="showCustom(true)">
       + Custom
      </button>
     </div>
     <div class="flex gap-2 overflow-x-auto pb-1" id="chips">
     </div>
     <div class="flex justify-between text-xs text-muted">
      <span id="count">
      </span>
      <button class="border border-gray-700 rounded-full px-3 py-1.5" id="favFilter">
       ☆ Favorites
      </button>
     </div>
    </div>
    <div class="flex-1 overflow-y-auto p-3 grid grid-cols-1 lg:grid-cols-2 gap-3 content-start" id="grid">
    </div>
   </section>
   <section class="fixed md:static inset-x-0 bottom-0 z-40 w-full md:w-1/3 h-[88vh] md:h-auto bg-panel flex flex-col border-l border-gray-800 rounded-t-2xl md:rounded-none translate-y-full md:translate-y-0 transition-transform" id="estimate">
    <div class="p-4 border-b border-gray-800 flex justify-between items-center">
     <div>
      <h2 class="text-xl font-semibold text-gold">
       Current Estimate
      </h2>
      <p class="text-xs text-muted" id="itemCount">
       0 items
      </p>
     </div>
     <button class="md:hidden w-11 h-11 bg-gray-800 rounded-full" onclick="showEstimate(false)">
      ✕
     </button>
    </div>
    <div class="flex-1 overflow-y-auto p-4 space-y-3" id="cart">
    </div>
    <div class="p-4 bg-gray-900 border-t border-gray-800 safe">
     <div class="grid grid-cols-2 gap-2 mb-3 no-print">
      <label class="text-xs text-muted">
       Crew size
       <select class="mt-1 w-full bg-ink border border-gray-700 rounded-lg p-2 text-base" id="crew" onchange="renderCart()">
        <option>
         1
        </option>
        <option selected="">
         2
        </option>
        <option>
         3
        </option>
        <option>
         4
        </option>
       </select>
      </label>
      <label class="text-xs text-muted">
       Workday
       <select class="mt-1 w-full bg-ink border border-gray-700 rounded-lg p-2 text-base" id="day" onchange="renderCart()">
        <option value="8">
         8 hours
        </option>
        <option value="10">
         10 hours
        </option>
       </select>
      </label>
      <label class="text-xs text-muted">
       Recycling
       <select class="mt-1 w-full bg-ink border border-gray-700 rounded-lg p-2 text-base" id="recycle" onchange="renderCart()">
        <option value="0">
         No
        </option>
        <option value="75">
         Yes (+$75)
        </option>
       </select>
      </label>
      <label class="text-xs text-muted">
       Materials
       <select class="mt-1 w-full bg-ink border border-gray-700 rounded-lg p-2 text-base" id="markup" onchange="renderCart()">
        <option>
         0
        </option>
        <option>
         5
        </option>
        <option>
         10
        </option>
       </select>
      </label>
     </div>
     <div class="space-y-1 text-sm">
      <div class="flex justify-between text-muted">
       <span>
        Install hours
       </span>
       <b class="text-white" id="install">
       </b>
      </div>
      <div class="flex justify-between text-muted">
       <span>
        Programming hours
       </span>
       <b class="text-white" id="program">
       </b>
      </div>
      <div class="flex justify-between text-muted">
       <span>
        Total hours
       </span>
       <b class="text-white" id="hours">
       </b>
      </div>
      <div class="flex justify-between text-muted">
       <span>
        Estimated crew days
       </span>
       <b class="text-white" id="days">
       </b>
      </div>
     </div>
     <div class="flex justify-between items-end border-t border-gray-700 mt-3 pt-3">
      <span>
       TOTAL
      </span>
      <b class="text-gold text-3xl" id="total">
      </b>
     </div>
     <div class="grid grid-cols-2 gap-2 mt-3 no-print">
      <button class="border border-gray-700 rounded-xl py-3" onclick="clearCart()">
       Clear
      </button>
      <button class="bg-gold text-ink font-bold rounded-xl py-3" onclick="print()">
       Print / PDF
      </button>
     </div>
    </div>
   </section>
  </main>
  <button class="md:hidden fixed left-3 right-3 bottom-3 z-30 bg-gold text-ink rounded-2xl px-4 py-3 font-bold flex justify-between safe" id="mobileBar" onclick="showEstimate(true)">
   <span>
    <span id="barQty">
     0
    </span>
    items ·
    <span id="barHours">
     0.00
    </span>
    hrs
   </span>
   <span id="barTotal">
   </span>
  </button>
  <div class="hidden md:hidden fixed inset-0 z-30 bg-black/70" id="backdrop" onclick="showEstimate(false)">
  </div>
  <div class="hidden fixed inset-0 z-50 bg-black/80 p-4 items-center justify-center" id="modal">
   <div class="bg-panel border border-gray-700 rounded-2xl p-5 w-full max-w-md">
    <div class="flex justify-between mb-4">
     <h3 class="text-gold font-bold text-lg">
      Add Custom Labor
     </h3>
     <button onclick="showCustom(false)">
      ✕
     </button>
    </div>
    <input class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 mb-3 text-base" id="customName" placeholder="Description"/>
    <div class="grid grid-cols-2 gap-3">
     <input class="bg-gray-900 border border-gray-700 rounded-xl p-3 min-w-0" id="customInstall" inputmode="decimal" placeholder="Install hrs" step=".25" type="number"/>
     <input class="bg-gray-900 border border-gray-700 rounded-xl p-3 min-w-0" id="customProgram" inputmode="decimal" placeholder="Program hrs" step=".25" type="number"/>
    </div>
    <button class="w-full mt-4 bg-gold text-ink font-bold rounded-xl py-3" onclick="addCustom()">
     Add to Estimate
    </button>
   </div>
  </div>

    "name": "Conduit Pull Existing Pathway",
    "installHours": 2.0,
    "programmingHours": 0.0
  }, {
    "category": "Wire Runs",
    "name": "HDMI Run 50'-100'",
    "installHours": 2.0,
    "programmingHours": 0.0
  }, {
    "category": "Wire Runs",
    "name": "HDMI Run up to 50'",
    "installHours": 1.0,
    "programmingHours": 0.0
  }, {
    "category": "Wire Runs",
    "name": "Outdoor Wire Run",
    "installHours": 3.0,
    "programmingHours": 0.0
  }, {
    "category": "Wire Runs",
    "name": "TV Power Relocation Kit",
    "installHours": 2.0,
    "programmingHours": 0.0
  }, {
    "category": "Wire Runs",
    "name": "Wire Run",
    "installHours": 1.0,
    "programmingHours": 0.0
  }];
CATALOG.forEach((x, i) => {
  x.id = i;
  x.total = x.installHours + x.programmingHours
});
let cart = [],
  category = 'All',
  favOnly = false,
  favs = new Set(JSON.parse(localStorage.getItem('asbc-favs') || '[]'));
const money = new Intl.NumberFormat('en-US', {
    style: 'currency',
    currency: 'USD'
  }),
  esc = s => String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  } [c]));

function setup() {
  ['All', ...new Set(CATALOG.map(x => x.category))].forEach(c => {
    const b = document.createElement('button');
    b.textContent = c;
    b.className =
      'chip shrink-0 border border-gray-700 bg-gray-900 rounded-full px-4 min-h-10 text-sm';
    b.onclick = () => {
      category = c;
      document.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x
        .textContent === c));
      renderCatalog()
    };
    chips.appendChild(b)
  });
  chips.firstChild.classList.add('active')
}

function renderCatalog() {
  const q = search.value.trim().toLowerCase(),
    items = CATALOG.filter(x => (category === 'All' || x.category === category) && (!q || (x.name +
      ' ' + x.category).toLowerCase().includes(q)) && (!favOnly || favs.has(x.id)));
  count.textContent = items.length + ' products';
  grid.innerHTML = items.length ? '' :
    '<p class="text-muted p-8 text-center">No matching products.</p>';
  items.forEach(x => {
    const found = cart.find(y => y.id === x.id && !y.custom),
      qty = found ? found.qty : 0,
      d = document.createElement('article');
    d.className = 'bg-gray-900 border border-gray-700 rounded-2xl p-4';
    d.innerHTML =
      `<div class="flex justify-between"><small class="text-gold uppercase">${esc(x.category)}</small><button onclick="favorite(${x.id})" class="w-11 h-11 -mt-2 -mr-2 text-xl ${favs.has(x.id)?'text-gold':'text-muted'}">${favs.has(x.id)?'★':'☆'}</button></div><h3 class="mb-3">${esc(x.name)}</h3><div class="border-t border-gray-800 pt-3 flex justify-between items-center"><small class="text-muted">${x.installHours.toFixed(2)} install + ${x.programmingHours.toFixed(2)} prog</small><div class="bg-gray-800 rounded-xl flex items-center"><button onclick="qty(${x.id},-1)" class="w-11 h-11 text-xl">−</button><b class="w-7 text-center">${qty}</b><button onclick="qty(${x.id},1)" class="w-11 h-11 text-xl">+</button></div></div>`;
    grid.appendChild(d)
  })
}

function qty(id, n) {
  const x = CATALOG[id],
    y = cart.find(z => z.id === id && !z.custom);
  if (y) {
    y.qty += n;
    if (y.qty <= 0) cart.splice(cart.indexOf(y), 1)
  } else if (n > 0) cart.push({
    ...x,
    qty: 1
  });
  renderCatalog();
  renderCart()
}

function cartQty(i, n) {
  cart[i].qty += n;
  if (cart[i].qty <= 0) cart.splice(i, 1);
  renderCatalog();
  renderCart()
}

function renderCart() {
  let ins = 0,
    prog = 0,
    num = 0;
  cart.innerHTML = '';
  if (!window.cart.length) cart.innerHTML =
    '<p class="text-muted text-center mt-10">No items added yet.</p>';
  window.cart.forEach((x, i) => {
    ins += x.installHours * x.qty;
    prog += x.programmingHours * x.qty;
    num += x.qty;
    const d = document.createElement('div');
    d.className =
      'bg-gray-900 border border-gray-800 rounded-xl p-3 flex justify-between items-center';
    d.innerHTML =
      `<div><b class="text-gold text-sm">${esc(x.name)}</b><p class="text-muted text-xs">${(x.total*x.qty).toFixed(2)} hrs</p></div><div class="flex bg-gray-800 rounded-lg"><button onclick="cartQty(${i},-1)" class="w-10 h-10">−</button><span class="w-7 text-center pt-2">${x.qty}</span><button onclick="cartQty(${i},1)" class="w-10 h-10">+</button></div>`;
    cart.appendChild(d)
  });
  const hrs = ins + prog,
    base = hrs * RATE,
    fee = +recycle.value,
    mat = base * (+markup.value / 100),
    sum = base + fee + mat;
  install.textContent = ins.toFixed(2);
  program.textContent = prog.toFixed(2);
  hours.textContent = barHours.textContent = hrs.toFixed(2);
  days.textContent = (hrs / (+crew.value * +day.value)).toFixed(2);
  total.textContent = barTotal.textContent = money.format(sum);
  itemCount.textContent = barQty.textContent = num + (num === 1 ? ' item' : ' items')
}

function favorite(id) {
  favs.has(id) ? favs.delete(id) : favs.add(id);
  localStorage.setItem('asbc-favs', JSON.stringify([...favs]));
  renderCatalog()
}

function showEstimate(v) {
  estimate.classList.toggle('open', v);
  backdrop.classList.toggle('hidden', !v)
}

function showCustom(v) {
  modal.classList.toggle('hidden', !v);
  modal.classList.toggle('flex', v)
}

function addCustom() {
  const i = +customInstall.value || 0,
    p = +customProgram.value || 0;
  if (!i && !p) return alert('Enter labor hours.');
  window.cart.push({
    id: 'c' + Date.now(),
    name: customName.value || 'Custom Labor',
    installHours: i,
    programmingHours: p,
    total: i + p,
    qty: 1,
    custom: true
  });
  showCustom(false);
  renderCart();
  showEstimate(true)
}

function clearCart() {
  if (!window.cart.length || confirm('Clear the estimate?')) {
    window.cart = [];
    renderCatalog();
    renderCart()
  }
}
search.oninput = renderCatalog;
favFilter.onclick = () => {
  favOnly = !favOnly;
  favFilter.classList.toggle('active', favOnly);
  favFilter.textContent = favOnly ? '★ Favorites' : '☆ Favorites';
  renderCatalog()
};
setup();
renderCatalog();
renderCart();
  </script>
 </body>
</html>
