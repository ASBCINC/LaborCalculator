<style>
:root { --gold:#1F6FD1; --bg:#F3F5F8; --card:#FFFFFF; --line:#E3E7EE; --muted:#4B5563; --good:#0E7A4D; --warn:#8A5A00; --bad:#B42318; --blue:#1F6FD1; --sf:#f59e0b; --la:#3b82f6; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:#1F2937; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
/* v9.1.0 one-screen layout: header, KPI strip and toolbar stay put; only the inside of columns/lists scrolls */
.wrap { height:100vh; height:100dvh; display:flex; flex-direction:column; max-width:1800px; margin:0 auto; padding:10px 14px; overflow:hidden; }
header { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; flex:0 0 auto; }
h1 { font-size:19px; margin:0; } h1 span { color:var(--gold); }
.muted { color:var(--muted); font-size:12px; }
.btn { display:inline-flex; align-items:center; justify-content:center; height:34px; padding:0 12px; border-radius:9px; border:1px solid var(--line); color:#1F2937; text-decoration:none; font-size:13px; font-weight:600; background:#FFFFFF; cursor:pointer; }
.kpis { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:8px; margin:8px 0; flex:0 0 auto; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:11px; padding:7px 10px; min-width:0; }
.kpi .l { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kpi .v { font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:1px; white-space:nowrap; }
.kpi .s { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; flex:0 0 auto; }

.tab, .chip { border:0; background:none; color:#374151; font-size:13px; font-weight:600; padding:6px 11px; border-radius:7px; cursor:pointer; white-space:nowrap; font-family:inherit; }
.tab.on { background:var(--gold); color:#FFFFFF; } .chip.on { background:#E8F1FC; color:#1F2937; box-shadow:inset 0 0 0 1px var(--gold); }
.tab .n { font-size:10px; font-weight:800; margin-left:4px; background:#FDECEC; color:var(--bad); border-radius:999px; padding:1px 5px; } .tab.on .n { background:#F3F5F8; }
input, select { background:#FFFFFF; border:1px solid var(--line); color:#1F2937; border-radius:9px; height:34px; padding:0 10px; font-size:14px; }

.colh .t { display:flex; justify-content:space-between; font-size:12px; font-weight:800; letter-spacing:.06em; }
.colh .n { color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; font-size:11px; margin-top:2px; }
.colb { overflow:auto; padding:8px; flex:1 1 auto; min-height:0; }
.pc { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 9px; margin-bottom:7px; cursor:pointer; }
.pc:hover { border-color:var(--gold); }
.pc.newp { border-color:#E0B860; box-shadow:inset 3px 0 0 var(--warn); }
.pc .nm { font-weight:700; font-size:13px; line-height:1.25; word-break:break-word; }
.pc .sub { color:var(--muted); font-size:11px; margin-top:2px; }
.pc .inst { color:var(--gold); font-size:11px; margin-top:3px; }
.money { display:flex; justify-content:space-between; font-size:11px; margin-top:4px; font-variant-numeric:tabular-nums; }
.pbar { height:4px; background:#F1F4F8; border-radius:3px; margin-top:3px; overflow:hidden; } .pbar i { display:block; height:100%; background:var(--good); }
.badges { display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; }
.bd { font-size:9.5px; font-weight:800; letter-spacing:.04em; padding:1px 6px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
.bd.w { color:var(--warn); border-color:#E0B860; } .bd.b { color:var(--bad); border-color:#F1A9A0; } .bd.g { color:var(--good); border-color:#8FD3B0; } .bd.u { color:var(--blue); border-color:#A9C6EE; }
.st { font-size:9px; font-weight:800; padding:1px 5px; border-radius:4px; margin-right:4px; vertical-align:1px; }
.st.SF { background:rgba(245,158,11,.18); color:var(--sf); } .st.PA { background:rgba(126,226,160,.15); color:var(--good); } .st.WH { background:rgba(59,130,246,.2); color:#1F6FD1; } .st.CM { background:rgba(201,160,255,.18); color:#6D28D9; } .st.UN { background:#F1F4F8; color:var(--muted); }
.msgs { margin-top:6px; border-top:1px solid #E3E7EE; padding-top:5px; }
.msg { font-size:11px; line-height:1.3; color:#374151; margin-top:3px; display:flex; gap:5px; }
.msg .src { flex:0 0 auto; font-size:9px; font-weight:800; letter-spacing:.04em; padding:1px 4px; border-radius:4px; background:#F1F4F8; color:var(--muted); height:fit-content; margin-top:1px; }
.msg.action .src { color:var(--warn); } .msg.blocker .src { color:var(--bad); background:#FDECEC; } .msg.deadline .src { color:var(--blue); }
.msg .tx { min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.empty { color:var(--muted); font-size:12px; padding:8px 4px; }
.panel { background:#FFFFFF; border:1px solid var(--line); border-radius:12px; height:100%; overflow:auto; padding:10px 12px; }
table { width:100%; border-collapse:collapse; font-size:12px; } td, th { text-align:left; padding:6px 5px; border-bottom:1px solid #E3E7EE; font-variant-numeric:tabular-nums; vertical-align:top; } th { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.05em; position:sticky; top:0; background:#FFFFFF; }
.r { text-align:right; }
tr.tot td { font-weight:800; border-top:1px solid var(--line); }
.hbar { height:8px; border-radius:4px; background:#F1F4F8; overflow:hidden; display:flex; min-width:120px; } .hbar i { display:block; height:100%; }
.split { display:grid; grid-template-columns:1.3fr 1fr; gap:10px; height:100%; }
.qrow { display:flex; gap:10px; align-items:flex-start; padding:8px 4px; border-bottom:1px solid #E3E7EE; cursor:pointer; } .qrow:hover { background:#11141a; }
.qrow .lv { flex:0 0 8px; height:8px; border-radius:50%; margin-top:5px; } .lv.high { background:var(--bad); } .lv.medium { background:var(--warn); } .lv.low { background:var(--muted); }
.qrow .w { flex:1; min-width:0; } .qrow .h { font-size:13px; font-weight:600; } .qrow .d { color:var(--muted); font-size:11px; margin-top:2px; }
.daycol .colh .t { font-size:11px; }
.ev2 { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--muted); border-radius:8px; padding:6px 7px; margin-bottom:6px; font-size:12px; cursor:pointer; }
.ev2.SF { border-left-color:var(--sf); } .ev2.LA { border-left-color:var(--la); } .ev2.BOTH { border-left-color:var(--sf); box-shadow:inset 3px 0 0 0 var(--la); }
.ev2 b { display:block; font-size:12px; } .ev2 .m { color:var(--muted); font-size:11px; margin-top:2px; }
.hol { color:#0F766E; font-size:10px; font-weight:700; }
.sheetbg { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60; display:flex; justify-content:flex-end; }
.sheet { width:min(560px, 100%); height:100%; overflow:auto; background:#0e1014; border-left:1px solid var(--line); padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
.sheet h3 { margin:0; font-size:18px; } .sect { margin:16px 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; }
.ev { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid #E3E7EE; font-size:13px; }
.ev .k { flex:0 0 74px; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding-top:2px; }
.ev .t { flex:1; min-width:0; line-height:1.35; } .ev .d { color:var(--muted); font-size:11px; margin-top:2px; }
.k-stage { color:var(--blue); } .k-co { color:var(--warn); } .k-payment { color:var(--good); } .k-job { color:var(--gold); } .k-new { color:var(--warn); } .k-value { color:#6D28D9; } .k-msg { color:#374151; }
/* phones and small tablets: normal page scroll, one column at a time */
@media (max-width:900px) {
  .wrap { height:auto; overflow:visible; }
  .main { overflow:visible; }
  .kpis { grid-template-columns:repeat(2, minmax(0,1fr)); }
  .board { grid-auto-flow:row; grid-auto-columns:auto; height:auto; }
  .colb { max-height:none; overflow:visible; }
  .panel { height:auto; } .split { grid-template-columns:1fr; height:auto; }
  .tabs { overflow-x:auto; max-width:100%; }
}

<body>
<div class="wrap">
  <header>
    <div><h1>ASBC <span>Pipeline</span></h1><div class="muted" id="synced"></div></div>
    <nav id="asbcNav" data-page="pipeline"><button class="hnav" data-keep id="refresh">Refresh</button></nav>
  </header>

    <input id="q" placeholder="Search project, client, rep" style="flex:1;min-width:160px;max-width:320px">

<script>
// v8.28.0 Admin pipeline: Anthony's D-Tools projects (he is PM) and the open opportunities he is a resource on.
// Data = Firestore pipeline/data (admins + sales directors), written by scripts/sync_pipeline.py on every D-Tools sync.
// v9.1.0 one-screen PM view: view tabs (Needs action, Board, Stores, Active jobs, Revenue, Opportunities), store filter
// (store = the sales rep's store in User Roles), projected revenue by store, and project messages from email, Teams,
// texts and calls (pipeline/feed, copied from Anthony's project dashboard by the D-Tools pull) inside each project tile.
firebase.initializeApp({ apiKey: "AIzaSyCSf560VkBf2esIH5rC-_Vcx349o7iIC-0", authDomain: "asbc-calculator.firebaseapp.com", projectId: "asbc-calculator" });
const db = firebase.firestore();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const usd = v => '$' + (Number(v) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd0 = v => '$' + Math.round(Number(v) || 0).toLocaleString('en-US');
const usdK = v => { v = Number(v) || 0; return Math.abs(v) >= 1e6 ? '$' + (v / 1e6).toFixed(2) + 'M' : Math.abs(v) >= 1e4 ? '$' + Math.round(v / 1e3) + 'k' : usd0(v); };
const days = iso => iso ? Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 864e5)) : null;
const ago = iso => { if (!iso) return ''; const m = Math.round((Date.now() - Date.parse(iso)) / 6e4); return m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
const fmtD = iso => iso ? new Date(String(iso).length === 10 ? iso + 'T00:00:00Z' : iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }) : '—';  // D-Tools dates are UTC midnight
const todayISO = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const t12 = v => { if (!v) return ''; const [h, m] = v.split(':').map(Number); return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'a' : 'p'); };
const COLS = [['NEW', ['new']], ['PLANNING', ['planning']], ['SCHEDULED', ['scheduled']], ['IN PROGRESS', ['in progress', 'delayed', 'on hold']], ['INSTALLED', ['installed']]];
const colOf = p => { const s = String(p.stage || '').toLowerCase(); const c = COLS.find(([, l]) => l.includes(s)); return c ? c[0] : (s === 'completed' ? null : 'IN PROGRESS'); };
const KIND = { stage: 'Stage', co: 'Change order', payment: 'Payment', job: 'Job report', new: 'Assigned', value: 'Value', msg: 'Message' };
const STORES = [['SF', 'San Francisco'], ['PA', 'Palo Alto'], ['WH', 'West Hollywood'], ['CM', 'Costa Mesa'], ['UN', 'Store not set']];
const SRC = { outlook: 'EMAIL', teams: 'TEAMS', sms: 'TEXT', call: 'CALL', transcript: 'MEETING', dtools: 'D-TOOLS' };
const VIEWS = [['action', 'Needs action'], ['board', 'Board'], ['stores', 'Stores'], ['active', 'Active jobs'], ['revenue', 'Revenue'], ['opps', 'Opportunities']];
let DATA = null, EVENTS = [], HOL = {}, FEED = [], FEED_AT = '', USERS = {}, QUOTES = [], CATALOG = new Map(), SETTINGS = {}, OPPS_ALL = [], CONF = [], IS_ADMIN = false, PEX = {};
const F = (() => { let s = {}; try { s = JSON.parse(localStorage.getItem('asbcPipeView') || '{}'); } catch (e) {} return { view: s.view || 'action', store: s.store || '', q: '' }; })();
const saveF = () => { try { localStorage.setItem('asbcPipeView', JSON.stringify({ view: F.view, store: F.store })); } catch (e) {} };

// ---- lookups
const storeOfRep = name => { const u = Object.values(USERS).find(x => x && x.name === name); const s = (u && u.store) || ''; const k = STORES.find(([, l]) => l === s); return k ? k[0] : 'UN'; };
const stTag = k => `<span class="st ${k}">${k === 'UN' ? '—' : k}</span>`;
function nextInstall(p) { const t = todayISO(); const l = EVENTS.filter(e => e.name === p.name && e.date >= t && e.kind !== 'event').sort((a, b) => (a.date + (a.start || '')).localeCompare(b.date + (b.start || ''))); return l[0] || null; }
const instTxt = e => fmtD(e.date) + (e.start ? ' ' + t12(e.start) + (e.end ? '–' + t12(e.end) : '') : '') + ((e.crew || []).length ? ' · ' + e.crew.map(n => n.split(' ')[0]).join(', ') : '');
// v9.3.0 parts, punch list, labor quotes, crew conflicts
const daysTo = d => d ? Math.round((Date.parse(d + 'T12:00:00Z') - Date.parse(todayISO() + 'T12:00:00Z')) / 864e5) : null;
const partsOk = p => !p.parts || !p.parts.known || !p.parts.total || p.parts.ready >= p.parts.total;
const quotesOf = p => QUOTES.filter(q => (q.project || {}).dtoolsProjectName === p.name || (q.project || {}).dtoolsOpportunityId === p.id);
const punchOf = p => quotesOf(p).flatMap(q => (q.punch || []).filter(x => !x.done).map(x => ({ t: x.t, q })));
const lineEst = it => { const c = it.isCustom ? it : (CATALOG.get(it.id) || {}); const per = (Number(c.installHours) || 0) + (Number(c.programmingHours) || 0) + (it.addon ? (Number(it.addon.installHours) || 0) + (Number(it.addon.programmingHours) || 0) : 0); return per * (Number(it.qty) || 0); };
const msgsOf = p => FEED.filter(m => m.project === p.name).sort((a, b) => String(b.date).localeCompare(String(a.date)));
const isReq = m => ['action', 'blocker', 'deadline'].includes(m.kind) && days(m.date) <= 21;
function flags(p) {
  const out = [], col = colOf(p), d = days(p.stageAt);
  if (/delayed/i.test(p.stage || '') && col !== 'INSTALLED') out.push(['DELAYED', 'b']);
  if (col === 'INSTALLED' && d >= 30) out.push(['CLOSE OUT', 'w']);
  if (EVENTS.length && ['IN PROGRESS', 'SCHEDULED'].includes(col) && !/delayed/i.test(p.stage || '') && !nextInstall(p)) out.push(['NOT SCHEDULED', 'w']);
  const pend = (p.cos || []).filter(c => !/accept|approv|declin|reject|void|cancel/i.test(c.state || ''));
  if (pend.length) out.push([pend.length + ' CO PENDING', 'w']);
  if (overdue(p).length) out.push(['INVOICE OVERDUE', 'b']); else if (openInv(p).length) out.push(['INVOICE OPEN', 'u']);
  if (col === 'INSTALLED' && (p.price || 0) - (p.paid || 0) > 1) out.push(['BALANCE ' + usd0((p.price || 0) - (p.paid || 0)), 'b']);
  const req = msgsOf(p).filter(isReq).length; if (req) out.push([req + ' REQUEST' + (req > 1 ? 'S' : ''), 'w']);
  const ni = nextInstall(p); if (!partsOk(p) && ni && daysTo(ni.date) <= 7) out.push([(p.parts.total - p.parts.ready) + ' PARTS NOT READY', 'b']);
  const pu = punchOf(p).length; if (pu) out.push([pu + ' PUNCH', 'w']);
  return out;
}
const unpaid = x => (Number(x.amount) || 0) - (Number(x.paid) || 0) > 0.01;
const openInv = p => (p.payments || []).filter(x => unpaid(x) && /invoic|overdue|due|sent/i.test(x.status || ''));
const overdue = p => (p.payments || []).filter(x => unpaid(x) && x.due && x.due.slice(0, 10) < todayISO());
const dueSoon = p => (p.payments || []).filter(x => unpaid(x) && x.due && x.due.slice(0, 10) <= addDays(todayISO(), 30)).reduce((a, x) => a + (Number(x.amount) || 0) - (Number(x.paid) || 0), 0);
const isNew = p => days(p.created) !== null && days(p.created) <= 7;
const lastEv = r => (r.feed || []).slice(-1)[0];
const match = r => (!F.q || `${r.name} ${r.client} ${r.number} ${r.rep || r.owner || ''}`.toLowerCase().includes(F.q)) && (!F.store || storeOfRep(r.rep || r.owner) === F.store);
const active = () => Object.values(DATA.projects || {}).filter(p => colOf(p));

// ---- cards
function card(p, showStore) {
  const pct = p.price ? Math.min(100, Math.round((p.paid || 0) / p.price * 100)) : 0, d = days(p.stageAt), ni = nextInstall(p), ms = msgsOf(p).slice(0, 2), fl = flags(p);
  return `<div class="pc ${isNew(p) ? 'newp' : ''}" data-id="${esc(p.id)}" data-t="p"><div class="nm">${showStore ? stTag(storeOfRep(p.rep)) : ''}${esc(p.name)}</div>
    <div class="sub">${esc(p.client || '')}${p.rep ? ' · ' + esc(p.rep) : ''}${showStore === 'stage' ? ' · ' + esc(colOf(p)) : ''}</div>
    <div class="money"><span>${usd0(p.price)}</span><span class="muted">${p.paid != null ? pct + '% paid' : ''}</span></div>${p.paid != null ? `<div class="pbar"><i style="width:${pct}%"></i></div>` : ''}
    ${ni ? `<div class="inst">Next install: ${esc(instTxt(ni))}</div>` : ''}${p.parts && p.parts.known && p.parts.total ? `<div class="sub" style="color:${partsOk(p) ? 'var(--good)' : 'var(--warn)'}">Parts ${p.parts.ready}/${p.parts.total} ready</div>` : ''}
    <div class="badges">${isNew(p) ? '<span class="bd w">NEW</span>' : ''}${d != null ? `<span class="bd">${d}d</span>` : ''}${fl.map(([t, c]) => `<span class="bd ${c}">${esc(t)}</span>`).join('')}</div>
    ${ms.length ? `<div class="msgs">${ms.map(m => `<div class="msg ${esc(m.kind)}"><span class="src">${SRC[m.source] || esc(m.source)}</span><span class="tx">${esc(m.title)} <span class="muted">· ${esc(ago(m.date))}</span></span></div>`).join('')}</div>`
      : (lastEv(p) ? `<div class="msgs"><div class="msg"><span class="src">${esc((KIND[lastEv(p).kind] || lastEv(p).kind).toUpperCase())}</span><span class="tx">${esc(lastEv(p).text)} <span class="muted">· ${esc(ago(lastEv(p).at))}</span></span></div></div>` : '')}</div>`;
}
const col = (title, sub, inner) => `<div class="col"><div class="colh"><div class="t"><span>${title}</span></div><div class="n">${sub}</div></div><div class="colb">${inner || '<div class="empty">None</div>'}</div></div>`;
const sum = (a, f) => a.reduce((x, r) => x + (Number(typeof f === 'function' ? f(r) : r[f]) || 0), 0);

// ---- KPI strip (follows the store filter)
function kpis(P, O) {
  const contract = sum(P, 'price'), paid = sum(P, 'paid'), soon = sum(P, dueSoon), od = sum(P, p => sum(overdue(p), x => (Number(x.amount) || 0) - (Number(x.paid) || 0)));
  const weighted = sum(O, o => (Number(o.total) || 0) * (Number(o.probability) || 0) / 100);

    ${type === 'p' && punchOf(r).length ? `<div class="sect">Punch list</div>${punchOf(r).map(x => `<div><a href="./jobs.html?quote=${encodeURIComponent(x.q.id || '')}" style="color:#1F2937">☐ ${esc(x.t)}</a></div>`).join('')}` : ''}
    ${type === 'p' ? `<div class="sect">Money</div><table><tr><td>Contract</td><td class="r">${usd(r.price)}</td></tr><tr><td>Paid</td><td class="r">${r.paid != null ? usd(r.paid) : '—'}</td></tr><tr><td>Balance</td><td class="r">${r.paid != null ? usd((r.price || 0) - r.paid) : '—'}</td></tr><tr><td>Due next 30 days</td><td class="r">${usd(dueSoon(r))}</td></tr></table>
      ${(r.payments || []).length ? `<div class="sect">Payments</div><table><tr><th>Name</th><th>Status</th><th>Due</th><th class="r">Amount</th><th class="r">Paid</th></tr>${r.payments.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.status)}</td><td>${fmtD(x.due)}</td><td class="r">${usd(x.amount)}</td><td class="r">${usd(x.paid)}</td></tr>`).join('')}</table>` : ''}
      ${(r.cos || []).length ? `<div class="sect">Change orders</div><table><tr><th>CO</th><th>Name</th><th>State</th><th class="r">Price</th></tr>${r.cos.map(c => `<tr><td>${esc(c.number)}</td><td>${esc(c.name)}</td><td>${esc(c.state)}</td><td class="r">${usd(c.price)}</td></tr>`).join('')}</table>` : ''}
      <div class="sect">Dates</div><table>${inst.map(e => `<tr><td>${e.kind === 'event' ? 'Event' : 'Install'}</td><td class="r">${esc(instTxt(e))}</td></tr>`).join('')}<tr><td>Won</td><td class="r">${fmtD(r.won)}</td></tr><tr><td>Start</td><td class="r">${fmtD(r.start)}</td></tr><tr><td>End</td><td class="r">${fmtD(r.end)}</td></tr><tr><td>Last D-Tools change</td><td class="r">${fmtD(r.modified)}</td></tr></table>`
    : `<div class="sect">Deal</div><table><tr><td>Value</td><td class="r">${usd(r.total)}</td></tr><tr><td>Probability</td><td class="r">${r.probability != null ? esc(r.probability) + '%' : '—'}</td></tr><tr><td>Weighted</td><td class="r">${usd((r.total || 0) * (r.probability || 0) / 100)}</td></tr><tr><td>Est. close</td><td class="r">${fmtD(r.estClose)}</td></tr><tr><td>Last D-Tools change</td><td class="r">${fmtD(r.modified)}</td></tr></table>`}
    <div class="sect">Activity and messages</div>${feed.map(e => `<div class="ev"><div class="k k-${esc(e.kind)}">${esc(KIND[e.kind] || e.kind)}</div><div class="t">${e.link ? `<a href="${esc(e.link)}" target="_blank" rel="noopener" style="color:#1F2937">${esc(e.text)}</a>` : esc(e.text)}<div class="d">${esc(new Date(e.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}</div></div></div>`).join('') || '<div class="empty">No activity recorded yet.</div>'}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-x]')) bg.remove(); });
  document.body.appendChild(bg);
}
document.getElementById('app').addEventListener('click', e => { const c = e.target.closest('[data-id]'); if (!c || !DATA) return; const r = (c.dataset.t === 'o' ? DATA.opps : DATA.projects)[c.dataset.id]; if (r) detail(r, c.dataset.t); });
async function load() {
  const s = await db.collection('pipeline').doc('data').get();
  if (!s.exists) { document.getElementById('app').innerHTML = '<div class="empty">No pipeline data yet. It appears after the next D-Tools sync (within about 10 minutes).</div>'; return; }
  DATA = JSON.parse(s.data().json || '{}');
  try { const ev = await db.collection('config').doc('dtoolsEvents').get(); EVENTS = (ev.exists && ev.data().events) || []; HOL = Object.fromEntries(((ev.exists && ev.data().holidays) || []).map(h => [h.date, h.name])); } catch (e) { EVENTS = []; }
  try { const fd = await db.collection('pipeline').doc('feed').get(); FEED = (fd.exists && fd.data().items) || []; FEED_AT = fd.exists ? fd.data().at : ''; } catch (e) { FEED = []; }
  const [qs, cat, st, op] = await Promise.all([db.collection('quotes').get().catch(() => null), db.collection('config').doc('catalog').get().catch(() => null), db.collection('config').doc('settings').get().catch(() => null), db.collection('opportunities').get().catch(() => null)]);
  QUOTES = qs ? qs.docs.map(d => ({ id: d.id, ...d.data() })).filter(q => !q.isTemplate && !q.jobDeleted) : [];
  CATALOG = new Map(((cat && cat.exists && cat.data().items) || []).map(i => [i.id, i]));
  SETTINGS = (st && st.exists && st.data()) || {};
  try { PEX = {}; (await db.collection('projectExpenses').get()).docs.forEach(d => { const x = d.data(); PEX[String(x.name || '').toLowerCase().replace(/[^a-z0-9]+/g, '')] = x.expenses || []; }); } catch (e) {}  // v9.7.0
  OPPS_ALL = op ? op.docs.map(d => ({ id: d.id, ...d.data() })) : [];
  try { CONF = window.asbcConflicts ? asbcConflicts(EVENTS.filter(e => e.date >= todayISO()), USERS) : []; } catch (e) { CONF = []; }
  render();
}
document.getElementById('refresh').onclick = () => load().catch(err => alertBox(err));
const alertBox = err => document.getElementById('app').innerHTML = '<div class="empty">Could not load: ' + esc(err.message || err) + '</div>';
firebase.auth().onAuthStateChanged(async u => {
  if (!u || !u.emailVerified) { document.getElementById('app').innerHTML = '<div class="empty">Sign in (and confirm your email) on the <a href="./" style="color:#1F6FD1">calculator</a> first.</div>'; return; }
  try { if (!(await u.getIdTokenResult()).claims.email_verified) { await u.reload(); await u.getIdToken(true); } } catch (e) {}  // v8.28.1: refresh a sign-in token issued before the email was confirmed
  const us = await db.collection('config').doc('users').get().catch(() => null);
  USERS = (us && us.exists && us.data().users) || {}; const email = (u.email || '').toLowerCase();
  IS_ADMIN = ASBCRoles.accessOf(USERS[email], email) === 'admin';
  if (!ASBCRoles.can(ASBCRoles.accessOf(USERS[email], email), 'pipeline')) return ASBCRoles.deny('pipeline', document.getElementById('app'));  // v8.29.0: admin + sales director
  load().catch(alertBox);
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
