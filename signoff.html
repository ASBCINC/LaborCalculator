<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Installation Sign-off | ASBC</title>
<link rel="icon" href="./favicon.svg">
<link rel="manifest" href="./manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
<script src="./roles.js"></script>
<script src="./update-check.js" defer></script>
<style>
:root { --gold:#C7A66A; --bg:#050505; --card:#111318; --line:#26292f; --muted:#8b8f98; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
.wrap { max-width:720px; margin:0 auto; padding:18px 16px 60px; }
.brand { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.brand img { height:34px; }
h1 { font-size:22px; margin:10px 0 2px; }
.muted { color:var(--muted); font-size:13px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:12px; }
.sect { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; margin-bottom:8px; }
.q { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #1d2026; font-size:16px; }
.q:last-child { border-bottom:0; }
.yn { display:flex; gap:6px; flex-shrink:0; }
.yn button { height:42px; min-width:64px; border-radius:10px; border:1px solid var(--line); background:#1a1d23; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
.yn button.on-yes { background:#1f4d33; border-color:#7ee2a0; color:#7ee2a0; }
.yn button.on-no { background:#4d1f1f; border-color:#ff8b8b; color:#ff8b8b; }
textarea, input[type=text] { background:#101216; border:1px solid var(--line); color:#fff; border-radius:10px; padding:12px; font-size:16px; width:100%; font-family:inherit; }
.ack { display:flex; gap:12px; align-items:flex-start; font-size:16px; line-height:1.4; cursor:pointer; }
.ack input { width:24px; height:24px; margin-top:2px; flex-shrink:0; accent-color:#C7A66A; }
#pad { width:100%; height:180px; background:#fff; border-radius:10px; touch-action:none; display:block; cursor:crosshair; }
.row { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
.btn { height:46px; padding:0 18px; border-radius:10px; border:1px solid var(--line); background:#1a1d23; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
.gold { background:var(--gold); color:#050505; border-color:var(--gold); }
.err { color:#ff8b8b; font-size:14px; margin-top:8px; min-height:18px; }
.work { white-space:pre-wrap; font-size:14px; color:#d7d9de; }
.done { text-align:center; padding:50px 10px; }
.done h2 { color:var(--gold); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="muted" style="text-align:center;padding:40px 0">Loading…</div></div>
<script>
// v8.20.0 Customer sign-off. The tech opens this from the job recap and hands the device to the client.
// Saved on the job as quotes/<id>.signoff (signature is a small PNG). Works offline; syncs when back online.
firebase.initializeApp({ apiKey: "AIzaSyCSf560VkBf2esIH5rC-_Vcx349o7iIC-0", authDomain: "asbc-calculator.firebaseapp.com", projectId: "asbc-calculator" });
const db = firebase.firestore();
try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qid = new URLSearchParams(location.search).get('quote');
const app = document.getElementById('app');
const QUESTIONS = [
  ['look', 'I am satisfied with the look and feel of the installation.'],
  ['av', 'I am satisfied with the sound and video quality.'],
  ['confident', 'I feel confident operating my system.'],
  ['issues', 'Are there any issues with the installation?'],
];
const ANS = {};
let Q = null, ME = null, inked = false;

function render() {
  const p = Q.project || {}, j = Q.job || {};
  const dates = ((Q.schedule || {}).dates || []).map(d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })).join(', ');
  app.innerHTML = `<div class="brand"><img src="./asbc-logo.png" alt="ASBC" onerror="this.remove()"></div>
    <h1>Installation Sign-off</h1>
    <div class="muted">${esc(p.dtoolsClientName || p.customerName || Q.label || '')}${p.dtoolsOppNumber ? ' · Project #' + esc(p.dtoolsOppNumber) : ''}${dates ? ' · ' + esc(dates) : ''}</div>
    ${(j.recap || {}).work ? `<div class="card"><div class="sect">Work completed</div><div class="work">${esc(j.recap.work)}</div></div>` : ''}
    <div class="card"><div class="sect">Your feedback</div>
      ${QUESTIONS.map(([k, t]) => `<div class="q"><div>${esc(t)}</div><div class="yn"><button type="button" data-k="${k}" data-v="yes">Yes</button><button type="button" data-k="${k}" data-v="no">No</button></div></div>`).join('')}
      <div id="issuesBox" style="display:none;margin-top:8px"><div class="sect">Please describe the issue</div><textarea id="issuesText" rows="3"></textarea></div>
    </div>
    <div class="card"><div class="sect">Additional comments (optional)</div><textarea id="comments" rows="3" placeholder="Anything else you'd like us to know"></textarea></div>
    <div class="card">
      <label class="ack"><input type="checkbox" id="ack"> <span>I acknowledge that the installation meets my expectations.</span></label>
      <div class="sect" style="margin-top:16px">Your name</div><input type="text" id="name" autocomplete="name" placeholder="Full name">
      <div class="sect" style="margin-top:16px">Signature</div><canvas id="pad"></canvas>
      <div class="row"><span class="muted">Sign with your finger or a stylus</span><button type="button" class="btn" id="clear" style="height:34px">Clear</button></div>
      <div class="err" id="err"></div>
      <button type="button" class="btn gold" id="submit" style="width:100%;margin-top:6px">Submit sign-off</button>
    </div>
    <div style="text-align:center;margin-top:14px"><a href="./jobs.html?quote=${encodeURIComponent(qid)}" class="muted">Technician: back to the job</a></div>`;
  app.querySelectorAll('.yn button').forEach(b => b.onclick = () => {
    ANS[b.dataset.k] = b.dataset.v;
    b.parentNode.querySelectorAll('button').forEach(x => x.className = '');
    b.className = b.dataset.v === 'yes' ? 'on-yes' : 'on-no';
    if (b.dataset.k === 'issues') document.getElementById('issuesBox').style.display = b.dataset.v === 'yes' ? '' : 'none';
  });
  pad();
  document.getElementById('submit').onclick = submit;
}

function pad() {
  const c = document.getElementById('pad'), ctx = c.getContext('2d');
  const size = () => { const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1; c.width = r.width * d; c.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; inked = false; };
  size(); window.addEventListener('resize', () => { if (!inked) size(); });
  let drawing = false, last = null;
  const pt = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  c.addEventListener('pointerdown', e => { drawing = true; last = pt(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill(); inked = true; });
  c.addEventListener('pointermove', e => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; inked = true; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => c.addEventListener(t, () => drawing = false));
  document.getElementById('clear').onclick = () => { ctx.clearRect(0, 0, c.width, c.height); inked = false; };
}

function signatureImage() {
  // small white-background PNG (about 10-30 KB) so it prints and emails cleanly
  const c = document.getElementById('pad'), out = document.createElement('canvas');
  out.width = 600; out.height = Math.round(600 * c.height / c.width);
  const x = out.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height); x.drawImage(c, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

async function submit() {
  const err = t => document.getElementById('err').textContent = t;
  const missing = QUESTIONS.filter(([k]) => !ANS[k]);
  if (missing.length) return err('Please answer Yes or No to each question.');
  const issuesText = document.getElementById('issuesText').value.trim();
  if (ANS.issues === 'yes' && !issuesText) return err('Please describe the issue.');
  if (!document.getElementById('ack').checked) return err('Please check the acknowledgement box.');
  const name = document.getElementById('name').value.trim();
  if (name.length < 2) return err('Please enter your name.');
  if (!inked) return err('Please sign in the white box.');
  const concerns = ANS.look === 'no' || ANS.av === 'no' || ANS.confident === 'no' || ANS.issues === 'yes';
  const signoff = { status: 'signed', answers: Object.assign({}, ANS), issuesText, comments: document.getElementById('comments').value.trim(),
    ack: true, name, signature: signatureImage(), signedAt: new Date().toISOString(), collectedBy: ME.email, concerns };
  document.getElementById('submit').disabled = true;
  const p = db.collection('quotes').doc(qid).set({ signoff }, { merge: true });
  if (navigator.onLine) { try { await p; } catch (e) { document.getElementById('submit').disabled = false; return err('Could not save: ' + e.message); } } else p.catch(() => {});
  app.innerHTML = `<div class="done"><h2>Thank you, ${esc(name.split(' ')[0])}!</h2><p>Your sign-off has been recorded${navigator.onLine ? '' : ' on this device and will sync when it is back online'}.</p><p class="muted">Please hand the device back to your technician.</p>
    <p style="margin-top:30px"><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="./jobs.html?quote=${encodeURIComponent(qid)}">Technician: back to the job</a></p></div>`;
}

firebase.auth().onAuthStateChanged(async (u) => {
  if (!u || !u.emailVerified) { app.innerHTML = '<div class="muted" style="text-align:center;padding:40px 0">The technician needs to be signed in (email confirmed) on this device. <a href="./" style="color:#C7A66A">Sign in</a></div>'; return; }
 try { if (!(await u.getIdTokenResult()).claims.email_verified) { await u.reload(); await u.getIdToken(true); } } catch (e) {}  // v8.28.1: refresh a sign-in token issued before the email was confirmed
  if (!qid) { app.innerHTML = '<div class="muted" style="text-align:center;padding:40px 0">No job selected.</div>'; return; }
  const email = (u.email || '').toLowerCase();
  const us = await db.collection('config').doc('users').get().catch(() => null);
  const users = (us && us.exists && us.data().users) || {};
  const p = users[email] || (email === 'a.ward@asbc.us' ? { role: 'admin' } : null);
  const s = await db.collection('quotes').doc(qid).get().catch(() => null);
  if (!s || !s.exists) { app.innerHTML = '<div class="muted" style="text-align:center;padding:40px 0">Job not found.</div>'; return; }
  Q = s.data(); ME = { email, role: (p || {}).role };
  const assigned = ((Q.schedule || {}).techs || []).includes(email);
  if (!p || !(ME.role === 'admin' || (ME.role === 'tech' && assigned))) { app.innerHTML = '<div class="muted" style="text-align:center;padding:40px 0">Only the assigned technician can collect this sign-off.</div>'; return; }
  render();
});
</script>
</body>
</html>
