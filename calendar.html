<style>
:root { --gold:#C7A66A; --bg:#050505; --card:#111318; --line:#26292f; --muted:#8b8f98; --sf:#f59e0b; --la:#3b82f6; --none:#6b7280; }
* { box-sizing:border-box; }

.day.today .num { background:var(--gold); color:#050505; }
.day.sel { outline:2px solid var(--gold); outline-offset:-2px; }

.ev { display:block; text-decoration:none; color:#fff; border-radius:6px; padding:3px 5px; margin-top:3px; font-size:11px; line-height:1.25; border-left:4px solid var(--none); background:#1b1f27; overflow:hidden; }

.ev .t { color:#c9ccd2; font-size:10px; white-space:nowrap; }
.ev.SF { border-left-color:var(--sf); background:rgba(245,158,11,.16); } .ev.LA { border-left-color:var(--la); background:rgba(59,130,246,.18); }
.ev.BOTH { border-left-color:var(--sf); background:linear-gradient(90deg, rgba(245,158,11,.22), rgba(59,130,246,.22)); }
.ev.done { opacity:.55; }
.conf { background:#2a1414; border:1px solid #8a2f2f; color:#ffb4b4; border-radius:10px; padding:8px 12px; margin:0 0 10px; font-size:13px; } .conf b { color:#fff; }
.warn { color:#ff8b8b; font-weight:800; margin-right:3px; }
.crew { width:100%; border-collapse:collapse; font-size:12px; } .crew th, .crew td { border:1px solid #26292f; padding:6px; vertical-align:top; text-align:left; } .crew th { color:#8b8f98; font-size:11px; background:#0b0d11; } .crew td.c { background:#2a1414; } .crew .h { color:#C7A66A; font-weight:700; } .crew .j { display:block; margin-top:2px; } .crewwrap { overflow-x:auto; }
.icbg { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:80; display:flex; align-items:center; justify-content:center; padding:16px; }
.ic { width:min(440px,100%); background:#111318; border:1px solid #26292f; border-radius:16px; padding:16px; box-shadow:0 16px 40px rgba(0,0,0,.6); }
.ich { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; } .ict { font-size:17px; font-weight:800; margin-bottom:4px; }
.icr { display:flex; gap:12px; padding:9px 0; border-top:1px solid #1d2027; font-size:14px; } .ick { flex:0 0 96px; color:#8b8f98; font-size:12px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; padding-top:2px; } .icv { flex:1; min-width:0; line-height:1.4; } .icv a { color:#C7A66A; }
@media (max-width:700px) { .icbg { align-items:flex-end; padding:0; } .ic { border-radius:16px 16px 0 0; padding-bottom:calc(16px + env(safe-area-inset-bottom)); } }
.hol { display:block; font-size:10px; font-weight:700; color:#2dd4bf; margin-top:3px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .aev.holr { border-left-color:#2dd4bf; cursor:default; }
.ev.dt { cursor:default; border-left-style:dashed; } .aev.dt { cursor:default; } .aev .desc { color:#e9dcc0; font-size:12px; margin-top:3px; white-space:pre-wrap; } .dtb { font-size:9px; font-weight:800; color:#C7A66A; letter-spacing:.05em; margin-right:4px; }
.more { font-size:10px; color:var(--muted); margin-top:3px; }
.agenda { margin-top:12px; }
.agenda h3 { font-size:14px; margin:0 0 6px; color:var(--gold); }
.aev { display:flex; gap:10px; align-items:center; text-decoration:none; color:#fff; background:var(--card); border:1px solid var(--line); border-left:6px solid var(--none); border-radius:10px; padding:10px 12px; margin-bottom:6px; }
.aev.SF { border-left-color:var(--sf); } .aev.LA { border-left-color:var(--la); } .aev.BOTH { border-left-color:var(--sf); box-shadow:inset 6px 0 0 -3px var(--la); }
.aev .nm { font-weight:700; font-size:15px; } .aev .meta { color:var(--muted); font-size:12px; margin-top:2px; }
.tag { font-size:10px; font-weight:800; letter-spacing:.05em; padding:2px 7px; border-radius:999px; border:1px solid; white-space:nowrap; }
.tag.SF { color:var(--sf); border-color:rgba(245,158,11,.5); } .tag.LA { color:var(--la); border-color:rgba(59,130,246,.5); } .tag.none { color:var(--muted); border-color:var(--line); }
.empty { text-align:center; color:var(--muted); padding:30px 0; }
select { background:#101216; border:1px solid var(--line); color:#fff; border-radius:9px; height:38px; padding:0 10px; font-size:14px; }
@media (max-width:700px) {
  .wrap { padding:10px 8px 40px; } .bar .month { min-width:0; flex:1; font-size:16px; }
  .legend { margin-left:0; width:100%; }
  .day { min-height:64px; padding:2px; } .num { font-size:11px; min-width:20px; height:20px; line-height:20px; }
  .ev { padding:0; height:6px; margin-top:2px; border-left-width:0; border-radius:3px; background:var(--none); }
  .ev.SF { background:var(--sf); } .ev.LA { background:var(--la); } .ev.BOTH { background:linear-gradient(90deg, var(--sf) 50%, var(--la) 50%); }
  .ev b, .ev .t { display:none; } .hol { font-size:8px; margin-top:2px; } .more { font-size:9px; }
}
</style>

<body>
<div class="wrap">
  <header>
    <h1>ASBC <span>Calendar</span></h1>
    <nav id="asbcNav" data-page="calendar"></nav>
  </header>

    <button class="btn" id="next" aria-label="Next month">›</button>

    <button class="btn" id="crewBtn" title="Who is booked or free each day">Crew / who's free</button>
    <button class="btn" id="syncBtn" style="display:none" title="Pull the D-Tools calendar into the app right now">Sync from D-Tools</button>
    <select id="teamF" aria-label="Filter by team"><option value="">All teams</option><option value="SF">SF Team</option><option value="LA">LA Team</option></select>
    <div class="legend"><span><i style="background:var(--sf)"></i>SF Team (Joseph, Eugene)</span><span><i style="background:var(--la)"></i>LA Team (Ivan, Mina)</span><span><i style="background:var(--none)"></i>Other / not assigned</span><span><b style="color:#C7A66A;font-size:10px">D-T</b> D-Tools calendar event (no job in the calculator)</span><span><b style="color:#2dd4bf;font-size:10px">Holiday</b></span><span><b style="color:#C7A66A;font-size:10px">EVT</b> D-Tools scheduled event (store work, pickups, holds)</span></div>
  </div>
  <div id="conf"></div>
  <div id="cal"><div class="empty">Loading…</div></div>
  <div class="agenda" id="agenda"></div>
</div>
<script>
// v8.26.0 Calendar: month view of every scheduled job (install dates + time window from Jobs > Schedule & assign).
// Team colors come from the assigned techs' first names: SF Team = Joseph, Eugene (orange); LA Team = Ivan, Mina (blue).
firebase.initializeApp({ apiKey: "AIzaSyCSf560VkBf2esIH5rC-_Vcx349o7iIC-0", authDomain: "asbc-calculator.firebaseapp.com", projectId: "asbc-calculator" });
const db = firebase.firestore();
try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
const TEAMS = { SF: { label: 'SF Team', names: ['joseph', 'eugene'] }, LA: { label: 'LA Team', names: ['ivan', 'mina'] } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// v8.34.0 holidays: US holidays built in, plus company holidays set in D-Tools (synced into config/dtoolsEvents.holidays)
function usHolidays(y) {
  const iso = d => d.toISOString().slice(0, 10), f = (m, d) => iso(new Date(Date.UTC(y, m, d)));
  const nth = (m, dow, n) => { const d = new Date(Date.UTC(y, m, 1)); while (d.getUTCDay() !== dow) d.setUTCDate(d.getUTCDate() + 1); d.setUTCDate(d.getUTCDate() + 7 * (n - 1)); return iso(d); };
  const last = (m, dow) => { const d = new Date(Date.UTC(y, m + 1, 0)); while (d.getUTCDay() !== dow) d.setUTCDate(d.getUTCDate() - 1); return iso(d); };
  const tg = nth(10, 4, 4), after = iso(new Date(Date.parse(tg + 'T12:00:00Z') + 864e5));
  return [[f(0, 1), "New Year's Day"], [nth(0, 1, 3), 'MLK Jr. Day'], [nth(1, 1, 3), "Presidents' Day"], [last(4, 1), 'Memorial Day'], [f(5, 19), 'Juneteenth'], [f(6, 4), 'Independence Day'],
    [nth(8, 1, 1), 'Labor Day'], [f(10, 11), 'Veterans Day'], [tg, 'Thanksgiving'], [after, 'Day after Thanksgiving'], [f(11, 24), 'Christmas Eve'], [f(11, 25), 'Christmas Day'], [f(11, 31), "New Year's Eve"]];
}
let HOLIDAYS = {}, ALLEV = [], CONF = [], CREW = false, WEEK = null, PURL = {}, PIPE = {};  // v10.3.0 PURL: project name -> D-Tools link
let ME = null, USERS = {}, JOBS = [], EVENTS = [], VIEW = new Date(), SEL = null;
VIEW.setDate(1);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const nameOf = e => (USERS[e] && USERS[e].name) || e;
const first = e => String(nameOf(e) || '').trim().split(/[\s@.]+/)[0].toLowerCase();
function teamOf(techs) {
  const f = (techs || []).map(first);
  const sf = f.some(n => TEAMS.SF.names.includes(n)), la = f.some(n => TEAMS.LA.names.includes(n));
  return sf && la ? 'BOTH' : sf ? 'SF' : la ? 'LA' : '';
}
const teamOfNames = names => { const f = (names || []).map(n => String(n || '').trim().split(/\s+/)[0].toLowerCase()); const sf = f.some(n => TEAMS.SF.names.includes(n)), la = f.some(n => TEAMS.LA.names.includes(n)); return sf && la ? 'BOTH' : sf ? 'SF' : la ? 'LA' : ''; };
const teamTag = t => t === 'BOTH' ? '<span class="tag SF">SF Team</span> <span class="tag LA">LA Team</span>' : t ? `<span class="tag ${t}">${TEAMS[t].label}</span>` : '<span class="tag none">No team</span>';
const t12 = v => { if (!v) return ''; const [h, m] = v.split(':').map(Number); return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'a' : 'p'); };
// v8.32.0: per-day windows from the D-Tools calendar (schedule.times[date]); D-Tools all-day events show "All day"
const windowOf = (s, d) => { s = s || {}; const w = (d && s.times && s.times[d]) || (s.times && Object.keys(s.times).length ? null : s); return w && w.start ? t12(w.start) + (w.end ? '–' + t12(w.end) : '') : s.fromDtools ? 'All day' : 'Time TBD'; };
const label = q => (q.project && q.project.dtoolsProjectName) || q.label || (q.project && q.project.customerName) || 'Untitled';  // v8.33.0 D-Tools project name first
function render() {
  const teamF = document.getElementById('teamF').value;
  const y = VIEW.getFullYear(), m = VIEW.getMonth();
  document.getElementById('monthLbl').textContent = VIEW.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const start = new Date(y, m, 1); start.setDate(1 - start.getDay());
  const byDay = {};
  JOBS.forEach(q => { const t = teamOf((q.schedule || {}).techs); if (teamF && t !== teamF && !(t === 'BOTH')) return;
    ((q.schedule || {}).dates || []).forEach(d => (byDay[d] = byDay[d] || []).push(Object.assign({ _team: t, _win: windowOf(q.schedule, d), _sort: (((q.schedule || {}).times || {})[d] || q.schedule || {}).start || '99' }, q))); });
  EVENTS.forEach(e => { const t = teamOfNames(e.people); if (teamF && t !== teamF && t !== 'BOTH') return;
    (byDay[e.date] = byDay[e.date] || []).push({ _ev: e, _team: t, _win: e.start ? t12(e.start) + (e.end ? '–' + t12(e.end) : '') : 'All day', _sort: e.start || '99', label: e.name }); });
  const hol = Object.assign({}, ...[y - 1, y, y + 1].map(yy => Object.fromEntries(usHolidays(yy))), HOLIDAYS);
  Object.entries(hol).forEach(([d, n]) => (byDay[d] = byDay[d] || []).push({ _hol: n, _sort: '00', _team: '' }));
  Object.values(byDay).forEach(l => l.sort((a, b) => String(a._sort).localeCompare(String(b._sort))));
  const today = ymd(new Date());
  let html = '<div class="grid">' + ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = ymd(d), evs = byDay[k] || [];
    if (i === 35 && d.getMonth() !== m) break;
    html += `<div class="day ${d.getMonth() !== m ? 'out' : ''} ${k === today ? 'today' : ''} ${k === SEL ? 'sel' : ''}" data-day="${k}"><span class="num">${d.getDate()}</span>` +
      evs.filter(q => q._hol).map(q => `<span class="hol" title="${esc(q._hol)}">${esc(q._hol)}</span>`).join('') +
      evs.filter(q => !q._hol).slice(0, 4).map(q => q._ev ? `<div class="ev dt ${q._team} ${/complete/i.test(q._ev.status) || /installed|completed/i.test(q._ev.stage) ? 'done' : ''}" data-ev="${esc(q._ev.id)}" style="cursor:pointer" title="${esc(q._ev.name)} · ${esc(q._win)}${q._ev.desc ? ' · ' + esc(q._ev.desc) : ''}"><b><span class="dtb">${q._ev.kind === 'event' ? 'EVT' : 'D-T'}</span>${esc(q._ev.name)}</b><span class="t">${esc(q._win)}</span></div>`
        : `<a class="ev ${q._team} ${['submitted', 'closed'].includes(q.status) ? 'done' : ''}" href="./jobs.html?quote=${encodeURIComponent(q._id)}" data-q="${esc(q._id)}" title="${esc(label(q))} · ${esc(q._win)}${((q.schedule || {}).notes || []).length ? ' · ' + esc(q.schedule.notes.join(' / ')) : ''}"><b>${CONF.some(c => c.date === k && [c.a, c.b].includes(label(q))) ? '<span class="warn">⚠</span>' : ''}${esc(label(q))}</b><span class="t">${esc(q._win)}</span></a>`).join('') +
      (evs.filter(q => !q._hol).length > 4 ? `<div class="more">+${evs.filter(q => !q._hol).length - 4} more</div>` : '') + '</div>';
  }
  document.getElementById('cal').innerHTML = html + '</div>';
  const mk = y + '-' + String(m + 1).padStart(2, '0'), cm = CONF.filter(c => c.date.startsWith(mk) || (c.date >= today && c.date <= ymd(new Date(Date.now() + 14 * 864e5))));
  document.getElementById('conf').innerHTML = cm.length ? `<div class="conf"><b>⚠ Crew double-booked:</b> ${cm.map(c => esc(c.techName.split(' ')[0] + ' ' + new Date(c.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' }) + ' — ' + c.a + ' + ' + c.b)).join(' · ')}</div>` : '';
  if (CREW) renderCrew();
  renderAgenda(byDay);
}
function renderAgenda(byDay) {
  const box = document.getElementById('agenda');
  const y = VIEW.getFullYear(), m = VIEW.getMonth();
  const days = SEL ? [SEL] : Object.keys(byDay).filter(k => k.startsWith(y + '-' + String(m + 1).padStart(2, '0'))).sort();
  const title = SEL ? new Date(SEL + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) : 'This month';
  box.innerHTML = `<h3>${esc(title)}${SEL ? ' <button class="btn" style="height:28px;font-size:11px;margin-left:6px" onclick="SEL=null;render()">Show whole month</button>' : ''}</h3>` +
    (days.flatMap(k => (byDay[k] || []).map(q => ({ k, q }))).map(({ k, q }) => { const day = SEL ? '' : esc(new Date(k + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })) + ' · ';
      if (q._hol) return `<div class="aev holr"><div style="flex:1;min-width:0"><div class="nm" style="color:#2dd4bf">${esc(q._hol)}</div><div class="meta">${day}Holiday</div></div></div>`;
      if (q._ev) { const e = q._ev; return `<div class="aev dt ${q._team}" data-ev="${esc(e.id)}" style="cursor:pointer"><div style="flex:1;min-width:0"><div class="nm"><span class="dtb">${e.kind === 'event' ? 'D-TOOLS EVENT' : 'D-TOOLS'}</span>${esc(e.name)}</div>
        <div class="meta">${day}${esc(q._win)} · ${esc(e.people.join(', ') || 'Nobody assigned')}${e.client ? ' · ' + esc(e.client) : ''}${e.address ? ' · ' + esc(e.address) : ''}</div>${e.desc ? `<div class="desc">${esc(e.desc)}</div>` : ''}</div>${teamTag(q._team)}</div>`; }
      const sc = q.schedule || {};
      return `<a class="aev ${q._team}" href="./jobs.html?quote=${encodeURIComponent(q._id)}" data-q="${esc(q._id)}"><div style="flex:1;min-width:0"><div class="nm">${esc(label(q))}</div>
      <div class="meta">${day}${esc(q._win)} · ${esc((sc.techs || []).map(nameOf).join(', ') || 'No techs')}${(q.project || {}).dtoolsClientName ? ' · ' + esc(q.project.dtoolsClientName) : ''}${sc.address ? ' · ' + esc(sc.address) : ''}</div>${(sc.notes || []).length ? `<div class="desc">${esc(sc.notes.join('\n'))}</div>` : ''}</div>${teamTag(q._team)}</a>`; }).join('') || '<div class="empty" style="padding:14px 0">Nothing scheduled.</div>');
}
// v9.2.0 tapping a job opens a customer card (name, address, appointment days and times, crew, sales rep) instead of the full job page
document.getElementById('agenda').addEventListener('click', e => { const c = e.target.closest('[data-q],[data-ev]'); if (!c) return; e.preventDefault(); c.dataset.q ? infoJob(c.dataset.q) : infoEv(c.dataset.ev); });
const pfold = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
function infoCard({ title, client, address, when, crew, team, rep, notes, href, pdf, files, parts, dt }) {
  document.querySelectorAll('.icbg').forEach(x => x.remove());
  const bg = document.createElement('div'); bg.className = 'icbg';
  const row = (k, v) => v ? `<div class="icr"><div class="ick">${k}</div><div class="icv">${v}</div></div>` : '';
  bg.innerHTML = `<div class="ic" role="dialog" aria-label="${esc(title)}"><div class="ich"><div><div class="ict">${esc(title)}</div>${team ? teamTag(team) : ''}</div><button class="btn" data-x aria-label="Close">✕</button></div>
    ${row('Customer', esc(client || '—'))}
    ${row('Address', address ? `<a href="https://maps.google.com/?q=${encodeURIComponent(address)}" target="_blank" rel="noopener">${esc(address)}</a>` : '—')}
    ${row('Appointment', when.map(w => esc(w)).join('<br>') || '—')}
    ${row('Assigned', esc(crew || 'Nobody assigned'))}
    ${row('Sales rep', esc(rep || '—'))}
    ${parts ? row('Parts', parts) : ''}
    ${pdf ? row('Proposal', `<a href="${esc(pdf)}" target="_blank" rel="noopener">Open proposal PDF</a>`) : ''}
