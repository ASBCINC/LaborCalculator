function go(p) { PATH = p; const h = p.map(encodeURIComponent).join('/'); if (location.hash.slice(1) !== h) history.pushState(null, '', h ? '#' + h : location.pathname + location.search); render(); window.scrollTo({ top: 0 }); }
window.addEventListener('popstate', () => { readHash(); render(); });
const tile = (name, sub, n, ic, attrs) => `<button type="button" class="br${n ? '' : ' empty'}" ${attrs}><span class="ic"><svg viewBox="0 0 24 24">${ic}</svg></span><span><div class="nm">${esc(name)}</div><div class="ct">${esc(sub)}${sub && n !== null ? ' · ' : ''}${n === null ? '' : count(n)}</div></span><span class="chev">›</span></button>`;
const docRow = (d, path) => `<div class="doc"><div class="ti">${d.kind ? `<span class="kind">${esc(d.kind)}</span>` : ''}<b>${esc(d.title)}</b>${path || d.src ? `<div class="meta">${path ? esc([d.cat, d.sub, d.product].join(' › ')) : ''}${path && d.src ? ' · ' : ''}${d.src ? 'from ' + esc(d.src) : ''}</div>` : ''}</div>
  <a class="btn blue" href="${esc(d.url)}"${/^https:/i.test(d.url) ? ' target="_blank" rel="noopener"' : ''}>Open ›</a>${ADMIN ? `<button type="button" class="adm" data-edit="${esc(d.id)}">Edit</button><button type="button" class="adm" data-del="${esc(d.id)}">Remove</button>` : ''}</div>`;
function crumbs() {
  const parts = [`<a data-go="">Knowledge Center</a>`].concat(PATH.map((p, i) => i === PATH.length - 1 ? `<b>${esc(p)}</b>` : `<a data-go="${esc(PATH.slice(0, i + 1).map(encodeURIComponent).join('/'))}">${esc(p)}</a>`));
  return `<div class="crumbs">${parts.join('<span class="sep">›</span>')}</div>`;
}
function form() {
  if (!ADMIN) return '';
  if (EDIT === null) return `<div style="margin-bottom:12px"><button type="button" class="btn green" id="addBtn">+ Add manual${PATH.length ? ' here' : ''}</button></div>`;
  const d = ITEMS.find(x => x.id === EDIT) || { cat: PATH[0] || 'Audio', sub: PATH[1] || '', product: PATH[2] || '', kind: 'Install guide' };
  const dl = (id, vals) => `<datalist id="${id}">${uniq(vals).filter(Boolean).sort().map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;
  return `<div class="form"><label>Category<select id="fCat">${CATS.map(([c]) => `<option ${d.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
    <label>Sub-category<input id="fSub" list="dlSub" value="${esc(d.sub)}" placeholder="e.g. B&O Speakers"></label>${dl('dlSub', ITEMS.map(x => x.sub))}
    <label>Product<input id="fProd" list="dlProd" value="${esc(d.product)}" placeholder="e.g. Beolab 28"></label>${dl('dlProd', ITEMS.map(x => x.product))}
    <label class="full">Title<input id="fTitle" value="${esc(d.title || '')}" placeholder="e.g. Wall bracket installation poster"></label>
    <label>Type<input id="fKind" list="dlKind" value="${esc(d.kind || '')}"></label>${dl('dlKind', ['Install guide', 'Poster', 'Setup', 'Technical', 'Wiring', 'Compatibility', 'Spec sheet', 'SOP', 'Training', 'Template'].concat(ITEMS.map(x => x.kind)))}
    <label style="grid-column:span 2">Link (OneDrive / SharePoint, vendor https link, or ./page in this app)<input id="fUrl" value="${esc(d.url || '')}" placeholder="https://…"></label>
    <div class="full" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button type="button" class="btn green" id="saveBtn">Save</button><button type="button" class="btn" id="cancelBtn">Cancel</button><span id="fMsg" style="color:#B42318;font-size:13px"></span></div></div>`;
}
function render() {
  const app = document.getElementById('app'); let html = '';
  if (Q.trim()) {
    const words = Q.toLowerCase().split(/\s+/).filter(Boolean), hit = ITEMS.filter(d => { const t = [d.title, d.product, d.sub, d.cat, d.kind].join(' ').toLowerCase(); return words.every(w => t.includes(w)); });
    html = `<div class="crumbs"><b>${count(hit.length)} matching “${esc(Q.trim())}”</b></div>` + (hit.length ? `<div class="list">${hit.sort((a, b) => (a.product + a.title).localeCompare(b.product + b.title)).map(d => docRow(d, true)).join('')}</div>` : '<div class="none">Nothing matches. Try a product name like “Beolab 28” or a word like “bracket”.</div>');
    app.innerHTML = html; return;
  }
  const [c, s, p] = PATH, inCat = ITEMS.filter(d => d.cat === c), inSub = inCat.filter(d => d.sub === s), inProd = inSub.filter(d => d.product === p);
  html = crumbs() + form();
  if (!c) html += `<div class="grid">${CATS.map(([name, sub, ic]) => tile(name, sub, ITEMS.filter(d => d.cat === name).length, ic, `data-go="${esc(encodeURIComponent(name))}"`)).join('')}</div>`;
  else if (!s) { const subs = uniq(inCat.map(d => d.sub)).sort();
    html += subs.length ? `<div class="grid">${subs.map(x => tile(x, (n => n + (n === 1 ? ' product' : ' products'))(uniq(inCat.filter(d => d.sub === x).map(d => d.product)).length), inCat.filter(d => d.sub === x).length, ICON_SUB, `data-go="${esc([c, x].map(encodeURIComponent).join('/'))}"`)).join('')}</div>` : `<div class="none">No manuals in ${esc(c)} yet.${ADMIN ? ' Use + Add manual here to start this branch.' : ''}</div>`; }
  else if (!p) { const prods = uniq(inSub.map(d => d.product)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    html += prods.length ? `<div class="grid">${prods.map(x => tile(x, '', inSub.filter(d => d.product === x).length, ICON_DOC, `data-go="${esc([c, s, x].map(encodeURIComponent).join('/'))}"`)).join('')}</div>` : '<div class="none">Nothing here yet.</div>'; }
  else { const order = ['SOP', 'Install guide', 'Poster', 'Wiring', 'Setup', 'Compatibility', 'Technical', 'Training', 'Template'], rank = k => { const i = order.indexOf(k); return i < 0 ? 99 : i; };
    html += inProd.length ? `<div class="list">${inProd.sort((a, b) => rank(a.kind) - rank(b.kind) || a.title.localeCompare(b.title)).map(d => docRow(d, false)).join('')}</div>` : '<div class="none">Nothing here yet.</div>'; }
  app.innerHTML = html;
  const ab = document.getElementById('addBtn'); if (ab) ab.onclick = () => { EDIT = ''; render(); };
  const cb = document.getElementById('cancelBtn'); if (cb) cb.onclick = () => { EDIT = null; render(); };
  const sb = document.getElementById('saveBtn'); if (sb) sb.onclick = save;
}
async function persist(next) { await REF.set({ items: next, updatedAt: new Date() }, { merge: true }); ITEMS = next; }
async function save() {
  const v = id => document.getElementById(id).value.trim(), msg = t => document.getElementById('fMsg').textContent = t;
  const d = { id: EDIT || ('k' + Date.now().toString(36)), cat: v('fCat'), sub: v('fSub').slice(0, 60), product: v('fProd').slice(0, 80), title: v('fTitle').slice(0, 160), kind: v('fKind').slice(0, 30), url: v('fUrl'), src: (ITEMS.find(x => x.id === EDIT) || {}).src || '' };
  if (!d.sub || !d.product || !d.title) return msg('Fill in sub-category, product and title.');
  if (!okUrl(d.url)) return msg('The link must start with https:// (or ./ for a page in this app).');
  try { await persist(ITEMS.filter(x => x.id !== d.id).concat([d])); EDIT = null; go([d.cat, d.sub, d.product]); } catch (e) { msg('Could not save: ' + (e.code || e.message)); }
}
document.addEventListener('click', async e => {
  const g = e.target.closest && e.target.closest('[data-go]'); if (g) { EDIT = null; go(g.dataset.go ? g.dataset.go.split('/').map(decodeURIComponent) : []); return; }
  const ed = e.target.closest && e.target.closest('[data-edit]'); if (ed) { EDIT = ed.dataset.edit; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const dl = e.target.closest && e.target.closest('[data-del]'); if (!dl) return;
  const d = ITEMS.find(x => x.id === dl.dataset.del); if (!d || !confirm('Remove "' + d.title + '" (' + d.product + ') from the Knowledge Center?')) return;
  try { await persist(ITEMS.filter(x => x.id !== d.id)); render(); } catch (err) { alert('Could not remove: ' + (err.code || err.message)); }
});
const qi = document.getElementById('q'); qi.oninput = () => { Q = qi.value; render(); };
firebase.auth().onAuthStateChanged(async u => {
  if (!u || !u.emailVerified) { location.replace('./index.html'); return; }
  try { if (!(await u.getIdTokenResult()).claims.email_verified) { await u.reload(); await u.getIdToken(true); } } catch (e) {}
  const email = (u.email || '').toLowerCase();
  const s = await db.collection('config').doc('users').get().catch(() => null);
  const access = ASBCRoles.accessOf(((s && s.exists && s.data().users) || {})[email], email);
  if (!ASBCRoles.can(access, 'knowledge')) return ASBCRoles.deny('knowledge', document.getElementById('app'));
  ADMIN = access === 'admin';
  let seeded = 0;
  try { const d = await REF.get(); ITEMS = ((d.exists && d.data().items) || []).filter(x => x && x.title && x.url); seeded = (d.exists && d.data().seedV) || 0; } catch (e) { ITEMS = []; seeded = SEED_V; }
  if (seeded < SEED_V) { ITEMS = ITEMS.concat(SEED.filter(x => (x.v || 1) > seeded && !ITEMS.some(y => y.id === x.id)).map(({ v, ...x }) => x));
    if (ADMIN) REF.set({ items: ITEMS, seedV: SEED_V, updatedAt: new Date() }, { merge: true }).catch(() => {}); }
  readHash(); render();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
