# v10.4.0 Deployed by .github/workflows/deploy-infra.yml on every push that changes cloudflare/** (wrangler deploy).
# Secrets (GITHUB_TOKEN, HOOK_SECRET, TEAMS_HOOK, RAMP_CLIENT_ID, RAMP_CLIENT_SECRET) stay in Cloudflare; keep_vars keeps dashboard vars.
name = "yellow-cloud-830a"
main = "dtools-sync-relay.js"
compatibility_date = "2025-01-01"
workers_dev = true
keep_vars = true

# v10.6.0 install photos taken in the app (namespace "asbc-job-photos", created Nov 24, 2026)
[[kv_namespaces]]
binding = "PHOTOS"
id = "8f990b31eb7d4b43b6bb91549803d66c"
