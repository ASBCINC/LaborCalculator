<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>ASBC | Home</title>
<link rel="icon" href="./favicon.svg">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="./diag.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
<script src="./roles.js"></script>
<script src="./nav.js" defer></script>
<script src="./health.js"></script>
<script src="./update-check.js" defer></script>
<style>
:root { --gold:#C7A66A; --bg:#050505; --card:#111318; --line:#26292f; --muted:#8b8f98; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
.wrap { max-width:760px; margin:0 auto; padding:calc(20px + env(safe-area-inset-top)) 16px 40px; }
.top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; }
.brand { display:flex; align-items:center; gap:12px; } .brand img { height:44px; }
h1 { margin:0; font-size:20px; } h1 span { color:var(--gold); }
.who { color:var(--muted); font-size:13px; margin-top:2px; }
.out { background:none; border:1px solid var(--line); color:var(--muted); border-radius:9px; height:36px; padding:0 12px; font-size:13px; cursor:pointer; }
.grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; }
.tile { display:flex; flex-direction:column; justify-content:space-between; min-height:120px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; color:#fff; text-decoration:none; }
.tile:hover, .tile:focus { border-color:var(--gold); outline:none; }
.tile svg { width:28px; height:28px; stroke:var(--gold); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.tile b { font-size:16px; display:block; margin-top:12px; } .tile span { color:var(--muted); font-size:12px; margin-top:3px; display:block; }
.empty { color:var(--muted); text-align:center; padding:40px 0; }
.tile .cnt { display:block; color:var(--gold); font-size:12px; font-weight:700; margin-top:6px; min-height:15px; }
.attn { background:var(--card); border:1px solid #5a4a2a; border-radius:16px; padding:14px 16px; margin-bottom:16px; }
.attn h2 { margin:0 0 8px; font-size:14px; color:var(--gold); letter-spacing:.04em; text-transform:uppercase; }
.attn a.it { display:block; color:#fff; text-decoration:none; padding:8px 0; border-top:1px solid var(--line); font-size:14px; } .attn a.it:first-of-type { border-top:0; }
.attn .lv { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; } .lv.high { background:#ef4444; } .lv.medium { background:#f59e0b; } .lv.low { background:#8b8f98; }
.attn .its { color:var(--muted); font-size:12px; margin:2px 0 0 16px; }
.top { flex-wrap:wrap; }
@media (min-width:720px) { .grid { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><div><h1>ASBC <span>Home</span></h1><div class="who" id="who"></div></div></div><nav id="asbcNav" data-page="home"></nav></div>
  <div id="app"><div class="empty">Loading…</div></div>
</div>
<script>
// v8.29.0 Navigation home: the first page after sign-in. Shows only the pages the signed-in person's role allows (roles.js).
firebase.initializeApp({ apiKey: "AIzaSyCSf560VkBf2esIH5rC-_Vcx349o7iIC-0", authDomain: "asbc-calculator.firebaseapp.com", projectId: "asbc-calculator" });
const db = firebase.firestore();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = {
  calendar: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  calculator: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M16 12h0M8 16h2M12 16h2M16 16h0"/></svg>',
  recaps: '<svg viewBox="0 0 24 24"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12l2 2 4-4M9 17h6"/></svg>',
  pipeline: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="6" rx="1"/></svg>',
  expenses: '<svg viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  leaderboard: '<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>',
  quotes: '<svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>',
  users: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3 6"/></svg>'
};
const SUB = { calendar: 'Scheduled installs by month', calculator: 'Build and save labor quotes', recaps: 'Time, recap, photos and sign-off',
  pipeline: 'Projects and opportunities', expenses: 'Ramp charges, receipts, travel by project', leaderboard: 'Quotes and accuracy by rep', quotes: 'Saved quotes', users: 'Who can see and edit what' };
const SHOW = ['calendar', 'calculator', 'recaps', 'pipeline', 'expenses', 'leaderboard', 'quotes', 'users'];
firebase.auth().onAuthStateChanged(async u => {
  if (!u || !u.emailVerified) { location.replace('./index.html'); return; }  // the calculator page holds the sign-in and email confirmation
  try { if (!(await u.getIdTokenResult()).claims.email_verified) { await u.reload(); await u.getIdToken(true); } } catch (e) {}
  const email = (u.email || '').toLowerCase();
  const us = await db.collection('config').doc('users').get().catch(() => null);
  const p = ((us && us.exists && us.data().users) || {})[email] || (email === ASBCRoles.OWNER ? { name: 'Anthony Ward', role: 'admin' } : null);
  const access = ASBCRoles.accessOf(p, email);
  if (!access) { document.getElementById('app').innerHTML = `<div class="empty">${esc(email)} isn't on the approved list yet. Ask Anthony to add you.</div>`; return; }
  document.getElementById('who').textContent = (p && p.name ? p.name + ' · ' : '') + ASBCRoles.DEFS[access].label;
  if (window.ASBC_TOOLS && window.asbcDashboard) return dash(access, p, email, (us && us.exists && us.data().users) || {});  // v11.0.0
  const pages = SHOW.filter(k => ASBCRoles.can(access, k));
  document.getElementById('app').innerHTML = '<div id="attn"></div><div class="grid">' + pages.map(k => `<a class="tile" href="${ASBCRoles.PAGES[k].href}">${ICON[k]}<div><b>${esc(ASBCRoles.PAGES[k].label)}</b><span>${esc(SUB[k])}</span><span class="cnt" id="cnt-${k}"></span></div></a>`).join('') + '</div>';
  counts(access, p, email).catch(() => {});
  if (access === 'admin') asbcHealth().then(showHealth).catch(() => {});
});
// v8.33.0 tile counts (O) and the admin "Needs attention" list (E, health.js)
const todayPT = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
const plusDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const setCnt = (k, t) => { const el = document.getElementById('cnt-' + k); if (el) el.textContent = t; };
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
async function counts(access, p, email) {
  const L = ASBCRoles.LEGACY[access] || {};
  let docs;
  if (L.role === 'tech' && !L.allQuotes) docs = (await db.collection('quotes').where('schedule.techs', 'array-contains', email).get()).docs;
  else if (L.role === 'rep' && !L.allQuotes) docs = (await db.collection('quotes').where('project.salesManagerName', '==', (p && p.name) || '').get()).docs;
  else docs = (await db.collection('quotes').get()).docs;
  const qs = docs.map(d => d.data()).filter(q => !q.isTemplate && !q.jobDeleted);
  const t = todayPT(), wk = plusDays(t, 6);
  const dates = q => (q.schedule || {}).dates || [];
  const jobs = qs.filter(q => ['won', 'scheduled', 'submitted', 'closed'].includes(q.status));
  const thisWeek = jobs.filter(q => dates(q).some(d => d >= t && d <= wk)).length;
  setCnt('calendar', thisWeek ? plural(thisWeek, 'install') + ' in the next 7 days' : 'Nothing in the next 7 days');
  const mine = L.role === 'tech' ? jobs.filter(q => (dates(q) || []).length && ((q.schedule || {}).techs || []).includes(email)) : jobs;
  const due = mine.filter(q => q.status === 'scheduled' && dates(q).some(d => d <= t) && !(q.job || {}).submittedAt).length;
  const upcoming = mine.filter(q => q.status === 'scheduled' && dates(q).some(d => d >= t)).length;
  setCnt('recaps', [due ? plural(due, 'report') + ' due' : '', upcoming ? upcoming + ' upcoming' : ''].filter(Boolean).join(' · ') || 'All caught up');
  setCnt('quotes', plural(qs.filter(q => !q.noQuote).length, 'saved quote'));
  try { const s = await db.collection('config').doc('users').get(); setCnt('users', plural(Object.keys((s.data() || {}).users || {}).length, 'person') .replace('persons', 'people')); } catch (e) {}
  if (ASBCRoles.can(access, 'pipeline')) try { const s = await db.collection('pipeline').doc('data').get(); if (s.exists) { const d = JSON.parse(s.data().json || '{}');
    const act = Object.values(d.projects || {}).filter(x => !/completed/i.test(x.stage || '')).length; setCnt('pipeline', plural(act, 'active project') + ' · ' + plural(Object.keys(d.opps || {}).length, 'opportunity').replace('opportunitys', 'opportunities')); } } catch (e) {}
}
// v11.0.0 ASBC Tools dashboard: each role's alerts + number cards (alerts.js). Techs land on My Jobs, reps on the Calculator,
// unless they open the Dashboard from the sidebar (?dash=1).
async function dash(access, p, email, users) {
  const qs = new URLSearchParams(location.search);
  if (!qs.has('dash') && ['installer', 'lead'].includes(access)) return location.replace('./jobs.html');
  if (!qs.has('dash') && access === 'manager') return location.replace('./index.html?calc=1');
  document.querySelector('.brand h1').innerHTML = 'ASBC <span>Dashboard</span>';
  const app = document.getElementById('app');
  app.innerHTML = '<div class="empty">Loading your dashboard…</div>';
  let d = { alerts: [], cards: [] };
  try { d = await asbcDashboard({ access, email, name: (p && p.name) || '', store: (p && p.store) || '', users }); } catch (e) { console.warn('dashboard', e); }
  const lv = { high: 'high', medium: 'medium', low: 'low' };
  app.innerHTML = `<div class="attn"${d.alerts.length ? '' : ' style="border-color:var(--line)"'}><h2>${d.alerts.length ? 'Needs attention (' + d.alerts.length + ')' : 'Needs attention'}</h2>${d.alerts.length ? d.alerts.map(i => `<a class="it" href="${esc(i.href)}"><span class="lv ${lv[i.level] || 'low'}"></span>${esc(i.text)}${(i.items || []).length ? `<div class="its">${esc(i.items.join(' · '))}</div>` : ''}</a>`).join('') : '<div style="color:var(--muted);font-size:14px">Nothing right now. You are all caught up.</div>'}</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${d.cards.map(c => `<a class="tile" href="${esc(c.href)}"><div><span style="margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${esc(c.label)}</span><b style="font-size:26px;margin-top:8px">${esc(c.value)}</b></div><span>${esc(c.sub || '')}</span></a>`).join('')}</div>`;
}
function showHealth(h) {
  const box = document.getElementById('attn'); if (!box) return;
  if (!h.issues.length) { box.innerHTML = '<div class="attn" style="border-color:var(--line)"><h2>Needs attention</h2><div style="color:var(--muted);font-size:14px">Nothing right now. Data checks all pass.</div></div>'; return; }
  box.innerHTML = '<div class="attn"><h2>Needs attention (' + h.issues.length + ')</h2>' + h.issues.map(i => `<a class="it" href="${esc(i.href)}"><span class="lv ${i.level}"></span>${esc(i.text)}${i.items.length ? `<div class="its">${esc(i.items.join(' · '))}</div>` : ''}</a>`).join('') + '</div>';
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
</html>
