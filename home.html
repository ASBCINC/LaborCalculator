<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>ASBC | Home</title>
<link rel="icon" href="./favicon.svg">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
<script src="./roles.js"></script>
<script src="./update-check.js" defer></script>
<style>
:root { --gold:#C7A66A; --bg:#050505; --card:#111318; --line:#26292f; --muted:#8b8f98; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
.wrap { max-width:760px; margin:0 auto; padding:calc(20px + env(safe-area-inset-top)) 16px 40px; }
.top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; }
.brand { display:flex; align-items:center; gap:12px; } .brand img { height:44px; }
h1 { margin:0; font-size:20px; } h1 span { color:var(--gold); }
.who { color:var(--muted); font-size:13px; margin-top:2px; }
.out { background:none; border:1px solid var(--line); color:var(--muted); border-radius:9px; height:36px; padding:0 12px; font-size:13px; cursor:pointer; }
.grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; }
.tile { display:flex; flex-direction:column; justify-content:space-between; min-height:120px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; color:#fff; text-decoration:none; }
.tile:hover, .tile:focus { border-color:var(--gold); outline:none; }
.tile svg { width:28px; height:28px; stroke:var(--gold); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.tile b { font-size:16px; display:block; margin-top:12px; } .tile span { color:var(--muted); font-size:12px; margin-top:3px; display:block; }
.empty { color:var(--muted); text-align:center; padding:40px 0; }
@media (min-width:720px) { .grid { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><div><h1>ASBC <span>Home</span></h1><div class="who" id="who"></div></div></div><button class="out" id="out" style="display:none">Sign out</button></div>
  <div id="app"><div class="empty">Loading…</div></div>
</div>
<script>
// v8.29.0 Navigation home: the first page after sign-in. Shows only the pages the signed-in person's role allows (roles.js).
firebase.initializeApp({ apiKey: "AIzaSyCSf560VkBf2esIH5rC-_Vcx349o7iIC-0", authDomain: "asbc-calculator.firebaseapp.com", projectId: "asbc-calculator" });
const db = firebase.firestore();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = {
  calendar: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  calculator: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M16 12h0M8 16h2M12 16h2M16 16h0"/></svg>',
  recaps: '<svg viewBox="0 0 24 24"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12l2 2 4-4M9 17h6"/></svg>',
  pipeline: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="6" rx="1"/></svg>',
  leaderboard: '<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>',
  quotes: '<svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>',
  users: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3 6"/></svg>'
};
const SUB = { calendar: 'Scheduled installs by month', calculator: 'Build and save labor quotes', recaps: 'Time, recap, photos and sign-off',
  pipeline: 'Projects and opportunities', leaderboard: 'Quotes and accuracy by rep', quotes: 'Saved quotes', users: 'Who can see and edit what' };
const SHOW = ['calendar', 'calculator', 'recaps', 'pipeline', 'leaderboard', 'quotes', 'users'];
document.getElementById('out').onclick = () => { if (confirm('Sign out on this device?')) firebase.auth().signOut().then(() => location.replace('./index.html')); };
firebase.auth().onAuthStateChanged(async u => {
  if (!u || !u.emailVerified) { location.replace('./index.html'); return; }  // the calculator page holds the sign-in and email confirmation
  try { if (!(await u.getIdTokenResult()).claims.email_verified) { await u.reload(); await u.getIdToken(true); } } catch (e) {}
  const email = (u.email || '').toLowerCase();
  const us = await db.collection('config').doc('users').get().catch(() => null);
  const p = ((us && us.exists && us.data().users) || {})[email] || (email === ASBCRoles.OWNER ? { name: 'Anthony Ward', role: 'admin' } : null);
  const access = ASBCRoles.accessOf(p, email);
  document.getElementById('out').style.display = '';
  if (!access) { document.getElementById('app').innerHTML = `<div class="empty">${esc(email)} isn't on the approved list yet. Ask Anthony to add you.</div>`; return; }
  document.getElementById('who').textContent = (p && p.name ? p.name + ' · ' : '') + ASBCRoles.DEFS[access].label;
  const pages = SHOW.filter(k => ASBCRoles.can(access, k));
  document.getElementById('app').innerHTML = '<div class="grid">' + pages.map(k => `<a class="tile" href="${ASBCRoles.PAGES[k].href}">${ICON[k]}<div><b>${esc(ASBCRoles.PAGES[k].label)}</b><span>${esc(SUB[k])}</span></div></a>`).join('') + '</div>';
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
</html>
